<!doctype html>
<html lang="zh-Hant-TW">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="逐筆帳本" />
    <meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0D1117" media="(prefers-color-scheme: dark)" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="apple-touch-icon" href="icon-180.png" />
    <link rel="icon" href="icon-192.png" />
    <title>逐筆帳本</title>
    <style>
      [hidden] {
        display: none !important;
      }
      img {
        max-width: 100%;
      }
      body {
        margin: 0;
      }
      :root {
        padding-top: env(safe-area-inset-top, 0px);
      }
      .sbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        height: env(safe-area-inset-top, 0px);
        background: var(--bg);
        z-index: 30;
      }
      /* Layout: phone-first ledger app — sticky month bar, one scrolling view, bottom tabs, full-height record sheet with calculator keypad */
      :root {
        --bg: #edf0f3;
        --surface: #ffffff;
        --surface2: #e3e8ed;
        --line: #d3dae1;
        --ink: #18212c;
        --muted: #5c6878;
        --accent: #2d58a8;
        --accent-ink: #ffffff;
        --accent-soft: #dce5f5;
        --exp: #bf4e37;
        --inc: #23856a;
        --xfer: #6f65a8;
        --warn: #9a6512;
        --shadow: 0 1px 2px rgba(24, 33, 44, 0.05);
        --hair: rgba(24, 33, 44, 0.07);
        --f-body:
          -apple-system, BlinkMacSystemFont, "PingFang TC", "Noto Sans TC", "Microsoft JhengHei", system-ui,
          sans-serif;
        --f-num: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
        --tab-h: 60px;
        --exp-ink: #ffffff;
        --hilite: 0.1;
        --seg-on: var(--surface);
        --seg-on-ink: var(--ink);
        --badge-bg: 15%;
        --badge-fg: 60%;
        --badge-fg-base: var(--ink);
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) {
          --bg: #0d1117;
          --surface: #1b232e;
          --surface2: #2a3443;
          --line: #394556;
          --ink: #e9edf3;
          --muted: #9eabbb;
          --accent: #8fb3f5;
          --accent-ink: #0f1622;
          --accent-soft: #263a5c;
          --exp: #f58c70;
          --inc: #4fd3a0;
          --xfer: #b8abf5;
          --warn: #e9b65c;
          --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
          --hair: rgba(255, 255, 255, 0.09);
          color-scheme: dark;
          --exp-ink: #1b232e;
          --hilite: 0.22;
          --seg-on: #3d4a5e;
          --seg-on-ink: #ffffff;
          --badge-bg: 32%;
          --badge-fg: 58%;
          --badge-fg-base: #ffffff;
        }
      }
      :root[data-theme="dark"] {
        --bg: #0d1117;
        --surface: #1b232e;
        --surface2: #2a3443;
        --line: #394556;
        --ink: #e9edf3;
        --muted: #9eabbb;
        --accent: #8fb3f5;
        --accent-ink: #0f1622;
        --accent-soft: #263a5c;
        --exp: #f58c70;
        --inc: #4fd3a0;
        --xfer: #b8abf5;
        --warn: #e9b65c;
        --shadow: 0 1px 2px rgba(0, 0, 0, 0.35);
        --hair: rgba(255, 255, 255, 0.09);
        color-scheme: dark;
        --exp-ink: #1b232e;
        --hilite: 0.22;
        --seg-on: #3d4a5e;
        --seg-on-ink: #ffffff;
        --badge-bg: 32%;
        --badge-fg: 58%;
        --badge-fg-base: #ffffff;
      }

      * {
        box-sizing: border-box;
      }
      html,
      body {
        height: 100%;
      }
      body {
        background: var(--bg);
        color: var(--ink);
        font: 15px/1.5 var(--f-body);
        -webkit-tap-highlight-color: transparent;
      }
      button,
      input,
      select {
        font: inherit;
        color: inherit;
      }
      button {
        cursor: pointer;
        border: 0;
        background: none;
        padding: 0;
      }
      :focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 2px;
      }
      .num {
        font-family: var(--f-num);
        font-variant-numeric: tabular-nums;
        letter-spacing: -0.01em;
      }
      .exp {
        color: var(--exp);
      }
      .inc {
        color: var(--inc);
      }
      .xfer {
        color: var(--xfer);
      }
      .muted {
        color: var(--muted);
      }
      .app {
        max-width: 560px;
        margin: 0 auto;
        padding: 0 16px calc(var(--tab-h) + 96px + env(safe-area-inset-bottom, 0px));
      }

      /* top bar */
      .top {
        position: sticky;
        top: env(safe-area-inset-top, 0px);
        z-index: 5;
        background: var(--bg);
        padding-block: 10px 8px;
        margin: 0 -16px;
        padding-inline: 16px;
        display: flex;
        align-items: center;
        gap: 8px;
      }
      .mswitch .mlabel.off {
        color: var(--accent);
        background: var(--accent-soft);
        border-radius: 999px;
      }
      .top h1 {
        white-space: nowrap;
        font-size: 17px;
        font-weight: 700;
        margin: 0;
        flex: 1;
        min-width: 0;
      }
      .mswitch {
        display: flex;
        align-items: center;
        gap: 2px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 999px;
        padding: 0 2px;
      }
      .mswitch button {
        width: 40px;
        height: 36px;
        border-radius: 999px;
        font-size: 18px;
        color: var(--muted);
      }
      .mswitch button:hover {
        background: var(--surface2);
      }
      .mswitch .mlabel {
        min-width: 92px;
        height: 36px;
        line-height: 36px;
        text-align: center;
        font-weight: 600;
        font-size: 15px;
        font-family: var(--f-num);
      }
      .mswitch .mlabel::after {
        content: "▾";
        font-size: 11px;
        margin-left: 4px;
        opacity: 0.6;
      }

      /* cards */
      .card,
      .day,
      .menu,
      .lst {
        border: 1px solid var(--hair);
      }
      .card {
        background: var(--surface);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 14px 16px;
      }
      .stack {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .summary {
        display: grid;
        grid-template-columns: repeat(3, 1fr);
        gap: 8px;
      }
      .summary .k {
        font-size: 12.5px;
        color: var(--muted);
        letter-spacing: 0.04em;
        white-space: nowrap;
      }
      .summary .v {
        font-size: 20px;
        font-weight: 600;
        line-height: 1.3;
      }
      /* 「上月同期 ▲245%」 pill next to the 支出 label */
      .summary .cmp {
        display: inline-block;
        margin-left: 4px;
        padding: 0 6px;
        border-radius: 999px;
        font-size: 12px;
        font-family: var(--f-num);
        letter-spacing: 0;
        line-height: 18px;
        vertical-align: 1px;
        background: color-mix(in srgb, currentColor 12%, transparent);
      }
      .meta-line {
        display: flex;
        align-items: center;
        gap: 8px;
        font-size: 13px;
        color: var(--muted);
        margin-top: 10px;
        padding-top: 8px;
        border-top: 1px dashed var(--line);
        min-height: 40px;
      }
      .meta-line .st {
        flex: 1;
        min-width: 0;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .meta-line b {
        color: var(--ink);
        font-weight: 600;
        font-family: var(--f-num);
      }
      .bar {
        position: relative;
        height: 8px;
        background: color-mix(in srgb, var(--ink) 12%, var(--surface));
        border-radius: 99px;
        overflow: hidden;
      }
      .bar > i {
        display: block;
        height: 100%;
        background: var(--accent);
        border-radius: 99px;
      }
      .bar.warn > i {
        background: var(--warn);
      }
      .bar.over > i {
        background: var(--exp);
      }
      /* 「今天應該在這」 tick on the budget bar */
      .bar > s {
        position: absolute;
        top: -1px;
        bottom: -1px;
        width: 2px;
        margin-left: -1px;
        background: var(--ink);
        opacity: 0.55;
      }
      .budline {
        display: flex;
        justify-content: space-between;
        gap: 8px;
        margin-top: 6px;
        font-size: 13px;
        color: var(--muted);
      }
      .banner {
        display: flex;
        gap: 10px;
        align-items: center;
        padding: 10px 14px;
        border-radius: 12px;
        background: var(--accent-soft);
        font-size: 14px;
      }
      .banner.warn {
        background: color-mix(in srgb, var(--warn) 18%, var(--surface));
      }
      .banner .grow {
        flex: 1;
        min-width: 0;
      }
      .banner .btn.sm {
        height: 36px;
      }

      /* day groups */
      .day {
        background: var(--surface);
        border-radius: 14px;
        box-shadow: var(--shadow);
        overflow: clip;
      }
      .stack > .day + .day {
        margin-top: 4px;
      }
      .dayhead {
        position: sticky;
        top: calc(env(safe-area-inset-top, 0px) + var(--toph, 56px));
        z-index: 3;
        display: flex;
        justify-content: space-between;
        align-items: center;
        gap: 8px;
        padding: 10px 16px 8px;
        background: var(--surface2);
        font-size: 13px;
        color: var(--muted);
      }
      .dayhead b {
        color: var(--ink);
        font-weight: 600;
        font-family: var(--f-num);
        font-size: 15px;
      }
      .dayhead .dhr .num {
        font-weight: 500;
      }
      .dayhead .dclr {
        flex: none;
        min-height: 36px;
        padding: 0 10px;
        margin: -8px 0 -8px 4px;
        border-radius: 9px;
        background: var(--surface);
        color: var(--accent);
        font-weight: 600;
        font-size: 13px;
      }
      .txw {
        position: relative;
        overflow: hidden;
        border-top: 1px solid var(--line);
      }
      .dayhead + .txw {
        border-top: 0;
      }
      /* the swipe actions live outside the row (just past its right edge, clipped by .txw) and slide in
         together with it, so they can only ever occupy the space the row has vacated — never the amount */
      .txa {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 100%;
        display: flex;
        transition: transform 0.22s ease;
      }
      .txa button {
        width: 72px;
        font-weight: 600;
        font-size: 14px;
        color: var(--accent-ink);
      }
      .txa .tdup {
        background: var(--accent);
      }
      .txa .tdel {
        background: var(--exp);
        color: var(--exp-ink);
      }
      .tx {
        position: relative;
        display: flex;
        align-items: center;
        gap: 12px;
        padding: 10px 16px;
        width: 100%;
        text-align: left;
        background: var(--surface);
        transition: transform 0.22s ease;
        touch-action: pan-y;
      }
      .txw.open .tx,
      .txw.open .txa {
        transform: translateX(-144px);
      }
      .sheet .dayhead {
        top: 0;
      }
      .txw.drag .tx,
      .txw.drag .txa {
        transition: none;
      }
      .dadd {
        width: 40px;
        height: 40px;
        margin: -8px -10px -8px 0;
        border-radius: 10px;
        color: var(--accent);
        font-size: 21px;
        line-height: 1;
        flex: none;
      }
      .dadd:hover {
        background: var(--surface);
      }
      .dhr {
        display: flex;
        align-items: center;
        gap: 6px;
      }
      .bksp {
        flex: none;
        width: 44px;
        height: 44px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: var(--muted);
        background: var(--surface2);
      }
      .bksp svg {
        width: 22px;
        height: 22px;
      }
      .ctop {
        display: flex;
        gap: 8px;
        align-items: center;
        padding-bottom: 8px;
      }
      .csearch {
        flex: 1;
        min-width: 0;
        height: 40px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        padding: 0 12px;
        font-size: 15px;
      }
      .ctop .btn.sm {
        height: 40px;
      }
      .hits {
        display: flex;
        flex-direction: column;
        gap: 4px;
        overflow-y: auto;
      }
      .nohit {
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 10px;
        padding: 12px 4px;
      }
      .hits button {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 10px;
        border-radius: 10px;
        background: var(--surface);
        text-align: left;
        font-size: 14.5px;
      }
      .hits .path {
        color: var(--muted);
        font-size: 13px;
      }
      .edinfo {
        text-align: center;
        font-size: 12px;
        color: var(--muted);
        margin: -2px 0 4px;
      }
      .dl {
        font-size: 12.5px;
        font-family: var(--f-num);
        min-width: 56px;
        text-align: right;
      }
      .dl.bad {
        color: var(--exp);
      }
      .dl.good {
        color: var(--inc);
      }
      .dl.flat {
        color: var(--muted);
      }
      .mgrid {
        display: grid;
        grid-template-columns: repeat(4, minmax(0, 1fr));
        gap: 6px;
        margin-top: 10px;
      }
      .mgrid button {
        border-radius: 10px;
        background: var(--surface2);
        padding: 8px 2px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 2px;
        font-size: 14px;
      }
      .mgrid button small {
        font-family: var(--f-num);
        font-size: 11.5px;
        color: var(--exp);
      }
      .mgrid button[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .mgrid button[aria-pressed="true"] small {
        color: var(--accent-ink);
      }
      .mgrid button:disabled {
        opacity: 0.35;
      }
      .trendhit {
        cursor: pointer;
      }
      /* density: the view package defines the compact rules (舒適／緊湊) */
      html[data-density="compact"] .tx {
        padding: 6px 14px;
        gap: 10px;
      }
      html[data-density="compact"] .badge {
        width: 28px;
        height: 28px;
        border-radius: 8px;
        font-size: 13px;
      }
      html[data-density="compact"] .tx .mid {
        display: flex;
        gap: 8px;
        align-items: baseline;
      }
      html[data-density="compact"] .tx .t1 {
        flex: none;
        max-width: 62%;
      }
      html[data-density="compact"] .tx .t2 {
        flex: 1;
        min-width: 0;
      }
      html[data-density="compact"] .tx .amt {
        font-size: 15px;
      }
      html[data-density="compact"] .tx .amt small {
        font-size: 12px;
      }
      html[data-density="compact"] .dayhead {
        padding: 7px 14px 5px;
      }
      html[data-density="compact"] .dayhead b {
        font-size: 14px;
      }
      html[data-density="compact"] .stack > .day + .day {
        margin-top: 0;
      }
      html[data-density="compact"] .summary .v {
        font-size: 18px;
      }
      html[data-density="compact"] .meta-line {
        margin-top: 8px;
        padding-top: 6px;
        min-height: 36px;
      }
      html[data-density="compact"] .cal .c {
        height: 44px;
      }
      html[data-density="compact"] .acrow {
        padding: 8px 14px;
      }
      html[data-density="compact"] .legend button {
        padding: 6px 2px;
      }
      .keys button:active,
      .subs button:active,
      .mains button:active,
      .chip:active,
      .btn:active,
      .bksp:active {
        transform: scale(0.96);
        transition: transform 0.05s;
      }
      .keys button {
        transition: transform 0.12s;
      }
      .sheet .sh,
      .rec .rh {
        touch-action: pan-x;
      }
      .grab {
        width: 36px;
        height: 4px;
        border-radius: 99px;
        background: var(--line);
        margin: 0 auto;
        flex: none;
      }
      .xferbox {
        display: grid;
        grid-template-columns: minmax(0, 1fr) auto minmax(0, 1fr);
        align-items: center;
        gap: 8px;
        margin: 6px 0 10px;
        padding: 12px;
        border-radius: 12px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .xferbox .ac {
        min-width: 0;
      }
      .xferbox .ac .selw {
        display: flex;
        align-items: center;
        gap: 2px;
        min-width: 0;
      }
      .xferbox .ac .xsel {
        appearance: none;
        -webkit-appearance: none;
        border: 0;
        background: transparent;
        padding: 0;
        margin: 0;
        height: 40px;
        min-width: 0;
        max-width: 100%;
        font-weight: 600;
        font-size: 15px;
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .xferbox .ac .chev {
        flex: none;
        color: var(--muted);
        font-size: 12px;
      }
      .xferbox .ac small {
        display: block;
        color: var(--muted);
        font-family: var(--f-num);
        font-size: 12px;
      }
      .pairs {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 0 0 10px;
        scrollbar-width: none;
      }
      .pairs::-webkit-scrollbar {
        display: none;
      }
      .pairs button {
        flex: none;
        min-height: 36px;
        padding: 6px 12px;
        border-radius: 999px;
        background: var(--surface2);
        font-size: 13.5px;
        white-space: nowrap;
      }
      .pairs button[aria-pressed="true"] {
        background: var(--accent-soft);
        color: var(--accent);
        font-weight: 600;
      }
      .xhint {
        margin: 0;
      }
      .xferbox .swap {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        background: var(--accent-soft);
        color: var(--accent);
        font-size: 20px;
        display: grid;
        place-items: center;
      }
      .summary .sub {
        font-size: 11.5px;
        margin-top: 2px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .legend button[data-list] {
        cursor: pointer;
      }
      .tapline {
        color: var(--accent);
        font-weight: 600;
        min-height: 40px;
        padding: 0 4px;
        margin: -10px 0 -10px -4px;
        border-radius: 8px;
      }
      /* opaque, and only for a real pointer: a translucent hover let the swipe buttons bleed through after a tap */
      @media (hover: hover) {
        .tx:hover {
          background: color-mix(in srgb, var(--surface2) 50%, var(--surface));
        }
      }
      .badge {
        flex: none;
        width: 36px;
        height: 36px;
        border-radius: 11px;
        display: grid;
        place-items: center;
        font-weight: 600;
        font-size: 13px;
        --c: var(--muted);
        background: color-mix(in srgb, var(--c) var(--badge-bg), var(--surface));
        color: color-mix(in srgb, var(--c) var(--badge-fg), var(--badge-fg-base));
      }
      .tx .mid {
        flex: 1;
        min-width: 0;
      }
      .tx .t1 {
        font-weight: 500;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tx .t2 {
        font-size: 12.5px;
        color: var(--muted);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .tx .amt {
        flex: none;
        display: flex;
        flex-direction: column;
        align-items: flex-end;
        line-height: 1.25;
        font-family: var(--f-num);
        font-weight: 600;
        font-size: 15.5px;
        white-space: nowrap;
      }
      .tx .amt small {
        font-size: 12.5px;
        font-weight: 500;
        color: var(--muted);
      }
      .tx mark {
        background: color-mix(in srgb, var(--warn) 30%, transparent);
        color: inherit;
        border-radius: 3px;
      }
      .empty {
        text-align: center;
        color: var(--muted);
        padding: 36px 12px;
      }

      /* onboarding */
      .onboard h2 {
        font-size: 19px;
        margin: 0 0 6px;
        text-wrap: balance;
      }
      .onboard p {
        margin: 0 0 14px;
        color: var(--muted);
        max-width: 60ch;
      }
      .btnrow {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 6px;
        height: 42px;
        padding: 0 16px;
        border-radius: 11px;
        background: var(--surface2);
        font-weight: 500;
      }
      .btn.primary {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .btn.danger {
        background: color-mix(in srgb, var(--exp) 14%, var(--surface));
        color: var(--exp);
      }
      .btn.sm {
        height: 40px;
        padding: 0 12px;
        font-size: 14px;
        border-radius: 9px;
      }
      .btn:disabled {
        opacity: 0.5;
        cursor: default;
      }

      /* tabs */
      .tabs {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        z-index: 20;
        background: var(--surface);
        border-top: 1px solid var(--line);
        padding-bottom: env(safe-area-inset-bottom, 0px);
      }
      .tabs .in {
        max-width: 560px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: repeat(5, 1fr);
        height: var(--tab-h);
      }
      .tabs button {
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 2px;
        font-size: 12px;
        color: var(--muted);
      }
      .tabs button svg {
        width: 22px;
        height: 22px;
      }
      .tabs button[aria-current="true"] {
        color: var(--accent);
        font-weight: 600;
      }
      .fab {
        position: fixed;
        z-index: 21;
        right: max(16px, calc(50% - 264px));
        bottom: calc(var(--tab-h) + 16px + env(safe-area-inset-bottom, 0px));
        width: 58px;
        height: 58px;
        border-radius: 18px;
        background: var(--accent);
        color: var(--accent-ink);
        box-shadow: 0 6px 18px color-mix(in srgb, var(--accent) 40%, transparent);
        display: grid;
        place-items: center;
      }
      .fab svg {
        width: 28px;
        height: 28px;
      }

      /* segmented */
      .seg {
        display: inline-flex;
        background: var(--surface2);
        border-radius: 10px;
        padding: 3px;
        gap: 2px;
      }
      .seg button {
        padding: 6px 14px;
        min-height: 40px;
        border-radius: 8px;
        font-size: 14px;
        color: var(--muted);
        font-weight: 500;
      }
      .seg button[aria-pressed="true"] {
        background: var(--seg-on);
        color: var(--seg-on-ink);
        box-shadow: var(--shadow);
      }
      /* the record sheet's 支出／收入／轉帳 choice carries its colour once chosen */
      .seg button[data-type="e"][aria-pressed="true"] {
        color: var(--exp);
      }
      .seg button[data-type="i"][aria-pressed="true"] {
        color: var(--inc);
      }
      .seg button[data-type="x"][aria-pressed="true"] {
        color: var(--xfer);
      }

      /* calendar */
      .cal {
        display: grid;
        grid-template-columns: repeat(7, 1fr);
        gap: 4px;
        --heatMax: 48%;
      }
      @media (prefers-color-scheme: dark) {
        :root:not([data-theme="light"]) .cal {
          --heatMax: 36%;
        }
      }
      :root[data-theme="dark"] .cal {
        --heatMax: 36%;
      }
      .cal .wd {
        font-size: 12px;
        text-align: center;
        color: var(--muted);
        padding-bottom: 2px;
      }
      .cal .c {
        position: relative;
        height: 48px;
        border-radius: 10px;
        padding: 4px 3px 5px;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: space-between;
        --heat: calc(var(--hf, 0) * var(--heatMax));
        background: color-mix(in srgb, var(--exp) var(--heat), var(--surface2));
        min-width: 0;
      }
      .cal .c.out {
        visibility: hidden;
      }
      .cal .c .dn {
        font-size: 14px;
        font-weight: 600;
        line-height: 1.1;
      }
      .cal .c .ds,
      .cal .c .di {
        display: block;
      }
      .cal .c .ds {
        font-size: 11.5px;
        line-height: 1.1;
        font-family: var(--f-num);
        color: var(--ink);
        white-space: nowrap;
        overflow: hidden;
        max-width: 100%;
      }
      .cal .c .di {
        font-size: 11.5px;
        font-family: var(--f-num);
        color: var(--inc);
        white-space: nowrap;
        overflow: hidden;
        max-width: 100%;
      }
      /* a day with income gets a green dot instead of a third line */
      .cal .c.hasInc::after {
        content: "";
        position: absolute;
        right: 4px;
        top: 4px;
        width: 5px;
        height: 5px;
        border-radius: 50%;
        background: var(--inc);
      }
      .cal .c.today {
        outline: 2px solid var(--accent);
        outline-offset: -2px;
      }
      .cal .c.sel {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .cal .c.sel .ds,
      .cal .c.sel .di {
        color: var(--accent-ink);
      }
      .cal .c.sel.hasInc::after {
        background: var(--accent-ink);
      }
      .calstrip {
        font-size: 13px;
        color: var(--muted);
        padding: 10px 16px;
      }
      .calstrip b {
        color: var(--ink);
        font-weight: 600;
        font-family: var(--f-num);
      }

      /* reports */
      .rowhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 10px;
        flex-wrap: wrap;
      }
      .rowhead h3 {
        margin: 0;
        font-size: 15px;
      }
      .rowhead h3 .undrill {
        min-height: 40px;
        padding: 0 10px;
        margin: -9px 2px -9px -10px;
        border-radius: 10px;
        color: var(--accent);
        font-weight: 600;
      }
      .legend {
        display: flex;
        flex-direction: column;
      }
      /* two-line legend rows: name + amount, then 「54.6% · ×3.5」 */
      .legend button {
        display: grid;
        grid-template-columns: 12px minmax(0, 1fr) auto;
        grid-template-rows: auto auto;
        column-gap: 10px;
        row-gap: 2px;
        align-items: center;
        padding: 9px 2px;
        border-top: 1px solid var(--line);
        text-align: left;
        width: 100%;
      }
      .legend button:first-child {
        border-top: 0;
      }
      .legend .sw {
        width: 12px;
        height: 12px;
        border-radius: 4px;
        grid-row: 1 / 3;
      }
      .legend .nm {
        grid-column: 2;
        grid-row: 1;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .legend .lv {
        grid-column: 3;
        grid-row: 1;
        font-family: var(--f-num);
        font-weight: 600;
        text-align: right;
      }
      .legend .meta {
        grid-column: 2 / 4;
        grid-row: 2;
        display: flex;
        gap: 10px;
        font-size: 13px;
        color: var(--muted);
      }
      .legend .pc {
        font-family: var(--f-num);
      }
      .legend .meta .dl {
        min-width: 0;
        font-size: 13px;
        text-align: left;
      }
      .chart svg {
        display: block;
        width: 100%;
        height: auto;
        overflow: visible;
      }
      .chart text {
        fill: var(--muted);
        font-family: var(--f-num);
        font-size: 11.5px;
      }
      .chart .grid {
        stroke: var(--line);
        stroke-width: 1;
      }
      .donutwrap {
        display: flex;
        justify-content: center;
        padding: 6px 0 4px;
      }
      .blist {
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .blist .bh {
        display: flex;
        justify-content: space-between;
        font-size: 14px;
        margin-bottom: 5px;
        gap: 8px;
      }

      /* accounts */
      .acgroup h4 {
        margin: 0;
        padding: 0;
        font-size: 13px;
        letter-spacing: 0.04em;
        color: var(--muted);
        font-weight: 600;
        background: var(--surface2);
      }
      .acgroup + .acgroup h4 {
        border-top: 1px solid var(--line);
      }
      .acgroup h4 .gh {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        width: 100%;
        min-height: 40px;
        padding: 6px 16px;
        text-align: left;
        color: inherit;
        font: inherit;
        letter-spacing: inherit;
      }
      .acgroup h4 .gh .num {
        letter-spacing: 0;
      }
      .acgroup h4 .gh .chev {
        display: inline-block;
        width: 14px;
        font-size: 11px;
        transition: transform 0.15s;
      }
      .acgroup.closed h4 .gh .chev {
        transform: rotate(-90deg);
      }
      .acgroup.closed .acrow {
        display: none;
      }
      .acrow {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 11px 16px;
        border-top: 1px solid var(--line);
        width: 100%;
        text-align: left;
        gap: 10px;
      }
      .acrow:first-child,
      h4 + .acrow {
        border-top: 0;
      }
      .acrow .nm {
        flex: 1;
        min-width: 0;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .acrow .nm small {
        color: var(--muted);
        font-size: 12px;
        margin-left: 6px;
      }
      .acrow.dim .nm,
      .acrow.dim .num {
        color: var(--muted);
      }
      .networth {
        display: grid;
        grid-template-columns: 1fr 1fr 1fr;
        gap: 8px;
      }
      .networth .v {
        font-size: 17px;
        font-weight: 600;
        line-height: 1.3;
      }
      .nwhead {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 8px;
        margin: -6px -8px 2px 0;
      }
      .nwnote {
        margin-top: 8px;
        font-size: 13px;
        color: var(--muted);
      }
      .nwnote .tapline {
        font-size: 13px;
        margin: -10px 0;
      }
      /* 調整順序 mode */
      .acsort .acrow {
        padding: 5px 8px 5px 16px;
        gap: 6px;
      }
      .acsort .acrow .nm {
        font-size: 14px;
      }
      .acsort .acrow .gsel {
        flex: none;
        height: 36px;
        width: 88px;
        font-size: 13px;
        padding: 0 6px;
        border: 1px solid var(--line);
        border-radius: 9px;
        background: var(--surface);
      }
      .sqb {
        flex: none;
        width: 40px;
        height: 40px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        color: var(--accent);
        font-size: 15px;
      }
      .sqb:disabled {
        opacity: 0.25;
      }
      .sqb svg {
        width: 20px;
        height: 20px;
      }
      .acsort h4 .gh {
        padding-right: 8px;
      }
      .acsort h4 .gh > span:last-child {
        display: flex;
        gap: 2px;
      }
      .acsort h4 .gh .sqb {
        color: var(--muted);
      }
      .nwhead .btn {
        flex: none;
        white-space: nowrap;
      }
      .pop {
        position: fixed;
        z-index: 50;
        min-width: 180px;
        background: var(--surface);
        border: 1px solid var(--line);
        border-radius: 12px;
        box-shadow: 0 8px 24px rgba(0, 0, 0, 0.18);
        padding: 4px;
        display: flex;
        flex-direction: column;
      }
      .pop button {
        display: flex;
        align-items: center;
        justify-content: space-between;
        gap: 12px;
        min-height: 44px;
        padding: 0 12px;
        border-radius: 9px;
        text-align: left;
        width: 100%;
        white-space: nowrap;
      }
      .pop button:hover {
        background: var(--surface2);
      }
      .pop button:disabled {
        color: var(--muted);
        cursor: default;
      }
      .pop button .ck {
        color: var(--accent);
        font-weight: 700;
      }
      .pop hr {
        border: 0;
        border-top: 1px solid var(--line);
        margin: 4px 8px;
      }

      /* more list */
      .menu {
        background: var(--surface);
        border-radius: 14px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .menu button {
        display: flex;
        align-items: center;
        gap: 12px;
        width: 100%;
        padding: 13px 16px;
        border-top: 1px solid var(--line);
        text-align: left;
      }
      .menu button:first-child {
        border-top: 0;
      }
      .menu .mi {
        width: 30px;
        height: 30px;
        border-radius: 9px;
        background: var(--accent-soft);
        color: var(--accent);
        display: grid;
        place-items: center;
        flex: none;
      }
      .menu .mi svg {
        width: 17px;
        height: 17px;
      }
      .menu .ml {
        flex: 1;
        min-width: 0;
      }
      .menu .ms {
        font-size: 12.5px;
        color: var(--muted);
      }
      .chev {
        color: var(--muted);
      }

      /* sheets */
      .sheet {
        position: fixed;
        inset: 0;
        z-index: 40;
        background: var(--bg);
        display: flex;
        flex-direction: column;
        padding-top: env(safe-area-inset-top, 0px);
        padding-bottom: env(safe-area-inset-bottom, 0px);
        animation: up 0.18s ease-out;
      }
      @keyframes up {
        from {
          transform: translateY(24px);
          opacity: 0.4;
        }
        to {
          transform: none;
          opacity: 1;
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .sheet,
        .toast {
          animation: none;
        }
        .tx,
        .keys button,
        .progress > i,
        .switch i,
        .switch i::after {
          transition: none;
        }
        .keys button:active,
        .subs button:active,
        .mains button:active,
        .chip:active,
        .btn:active,
        .bksp:active {
          transform: none;
        }
      }
      .sheet .sh {
        flex: none;
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 8px 12px;
        max-width: 560px;
        width: 100%;
        margin: 0 auto;
      }
      .sheet .sh h2 {
        flex: 1;
        margin: 0;
        font-size: 17px;
        text-align: center;
      }
      .iconbtn {
        width: 40px;
        height: 40px;
        border-radius: 12px;
        display: grid;
        place-items: center;
        color: var(--muted);
      }
      .iconbtn:hover {
        background: var(--surface2);
      }
      .iconbtn svg {
        width: 22px;
        height: 22px;
      }
      .sheet .sb {
        flex: 1;
        overflow: auto;
        max-width: 560px;
        width: 100%;
        margin: 0 auto;
        padding: 4px 16px 24px;
      }
      .field {
        display: flex;
        flex-direction: column;
        gap: 5px;
      }
      .field label,
      .flabel {
        font-size: 12.5px;
        color: var(--muted);
        letter-spacing: 0.03em;
      }
      .inp {
        height: 42px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
        padding: 0 12px;
        width: 100%;
        min-width: 0;
      }
      textarea.inp {
        height: auto;
        padding: 10px 12px;
      }
      .grid2 {
        display: grid;
        grid-template-columns: 1fr 1fr;
        gap: 10px;
      }
      .lst {
        background: var(--surface);
        border-radius: 14px;
        box-shadow: var(--shadow);
        overflow: hidden;
      }
      .lst .li {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 11px 14px;
        border-top: 1px solid var(--line);
      }
      .lst .li:first-child {
        border-top: 0;
      }
      .lst .li .grow {
        flex: 1;
        min-width: 0;
      }
      .chips {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
      }
      .chip {
        padding: 5px 11px;
        border-radius: 999px;
        background: var(--surface2);
        font-size: 13.5px;
      }
      .chip[aria-pressed="true"] {
        background: var(--accent);
        color: var(--accent-ink);
      }
      .small {
        font-size: 12.5px;
      }
      .progress {
        height: 6px;
        background: var(--surface2);
        border-radius: 99px;
        overflow: hidden;
      }
      .progress > i {
        display: block;
        height: 100%;
        background: var(--accent);
        width: 0;
        transition: width 0.2s;
      }
      table.prev {
        border-collapse: collapse;
        font-size: 12.5px;
        width: 100%;
      }
      table.prev th,
      table.prev td {
        padding: 5px 8px;
        border-bottom: 1px solid var(--line);
        white-space: nowrap;
        text-align: left;
      }
      .scrollx {
        overflow-x: auto;
      }

      /* record sheet */
      .rec {
        display: flex;
        flex-direction: column;
        flex: 1;
        max-width: 560px;
        width: 100%;
        margin: 0 auto;
        min-height: 0;
      }
      .rec .rh {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 12px 4px;
      }
      .rec .rh .seg {
        flex: 1;
        display: flex;
        padding: 4px;
      }
      .rec .rh .seg button {
        flex: 1;
        min-height: 40px;
        padding: 6px 10px;
      }
      .amount {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 2px 16px 12px;
        padding: 8px 14px;
        border-radius: 14px;
        background: var(--surface);
        box-shadow: var(--shadow);
      }
      .curs {
        flex: none;
        width: 96px;
        font-family: var(--f-num);
      }
      .mains .csbtn .dot svg {
        width: 15px;
        height: 15px;
      }
      .notew {
        grid-column: span 2;
        display: flex;
        gap: 6px;
      }
      .notew .inp {
        flex: 1;
        min-width: 0;
      }
      .ptag {
        flex: none;
        height: 40px;
        padding: 0 11px;
        border-radius: 10px;
        background: var(--surface2);
        color: var(--muted);
        font-size: 13px;
        max-width: 42%;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .ptag[aria-expanded="true"] {
        color: var(--ink);
      }
      .notew .nsave {
        display: none;
        flex: none;
        height: 40px;
        border-radius: 10px;
      }
      .recfields .nsug {
        grid-column: span 2;
        padding: 0 0 2px;
      }
      .amount .disp {
        flex: 1;
        min-width: 0;
        text-align: right;
        overflow: hidden;
      }
      .amount .expr {
        font-size: 13px;
        color: var(--muted);
        font-family: var(--f-num);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        min-height: 18px;
      }
      .amount .val {
        font-family: var(--f-num);
        font-weight: 600;
        font-size: 30px;
        line-height: 1.15;
        white-space: nowrap;
      }
      .amount .val .sel {
        background: var(--accent-soft);
        border-radius: 8px;
        padding: 0 6px;
        margin-right: -6px;
      }
      .amount .curtag {
        font-size: 13px;
        font-weight: 500;
        color: var(--muted);
        margin-right: 8px;
        vertical-align: 6px;
      }
      .ratew {
        flex: 1;
        min-width: 0;
        display: flex;
        align-items: center;
        gap: 6px;
        height: 40px;
        padding: 0 10px;
        border: 1px solid var(--line);
        border-radius: 10px;
        background: var(--surface);
      }
      .ratew small {
        flex: none;
        font-size: 12px;
      }
      .rate {
        width: 100%;
        min-width: 0;
        height: 100%;
        border: 0;
        background: transparent;
        padding: 0;
        font-size: 14px;
      }
      .catarea {
        flex: 1;
        min-height: 196px;
        display: flex;
        flex-direction: column;
        padding: 0 16px;
        overflow: hidden;
      }
      .panes {
        flex: 1;
        min-height: 0;
        display: grid;
        grid-template-columns: minmax(116px, 34%) minmax(0, 1fr);
        gap: 8px;
      }
      .panes > * {
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .panes > .subcol {
        overflow: hidden;
        display: flex;
        flex-direction: column;
      }
      .subcol .subs {
        flex: 1;
        min-height: 0;
        overflow-y: auto;
        overscroll-behavior: contain;
      }
      .nsug {
        display: flex;
        gap: 6px;
        overflow-x: auto;
        padding: 0 0 2px;
        scrollbar-width: none;
      }
      .nsug::-webkit-scrollbar {
        display: none;
      }
      .nsug button {
        flex: none;
        min-height: 36px;
        padding: 6px 12px;
        border-radius: 10px;
        background: var(--surface2);
        font-size: 13.5px;
        white-space: nowrap;
        max-width: 60vw;
        overflow: hidden;
        text-overflow: ellipsis;
      }
      .nsug .nmore {
        background: var(--accent-soft);
        color: var(--accent);
      }
      .nsug .lbl {
        flex: none;
        font-size: 12px;
        color: var(--muted);
        align-self: center;
      }
      .dlab {
        position: relative;
        flex: 1;
        min-width: 0;
        height: 38px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 14px;
        white-space: nowrap;
        overflow: hidden;
      }
      .dlab > span {
        display: block;
        min-width: 0;
        max-width: 100%;
        overflow: hidden;
        text-overflow: ellipsis;
        white-space: nowrap;
      }
      .dlab input {
        position: absolute;
        inset: 0;
        opacity: 0;
        width: 100%;
        height: 100%;
        border: 0;
        padding: 0;
      }
      .tact {
        margin-left: 12px;
        font-weight: 700;

        if (/^\(分期\)|^借入/.test(n)) return "負債";

        if (/^\(投\)|^（投）|股|ETF|基金|證券/.test(n)) return "投資";
        if (/^\(產\)|^（產）|房|車$/.test(n)) return "資產";
        if (/^\(貸\)|^（貸）|貸|借/.test(n)) return "負債";
        if (/卡/.test(n)) return "信用卡";

          } else amtHTML = "⇄ " + money(v, { dec: true });

        const mk = opt.mark;
        return `<div class="txw"><div class="txa" aria-hidden="true"><button class="tdup" data-act="txdup" data-id="${esc(t.id)}" data-d="${t.d}" tabindex="-1">複製</button><button class="tdel" data-act="txdel" data-id="${esc(t.id)}" data-d="${t.d}" tabindex="-1">刪除</button></div><button class="tx" data-tx="${esc(t.id)}" data-d="${t.d}">
    <span class="badge" style="--c:${L.color}">${esc(L.ch)}</span>
    <span class="mid"><div class="t1">${mk ? markHTML(title, mk) : esc(title)}${t.rec ? ' <span class="muted small">↻</span>' : ""}</div><div class="t2">${mk ? markHTML(bits.join(" · "), mk) : esc(bits.join(" · "))}</div></span>
    <span class="amt ${cls}"><span>${amtHTML}</span>${fx}${opt.extra || ""}</span></button></div>`;
      }
      // one <section class="day"> per date, newest first
      // opt.add: calendar ＋ on each head; opt.year: show the year when the list is not all this year
      // opt.clear: a 「全月 ×」 chip (calendar, selected day); opt.row: options passed to txRow
      // opt.rowExtra(t): per-row second line (account page running balance)
      function dayGroupList(list, opt = {}) {
        const by = {};
        for (const t of list) (by[t.d] || (by[t.d] = [])).push(t);
        const td = todayStr();
        const keys = Object.keys(by).sort().reverse();
        // if the results span more than one year, every head carries its year
        const yrs = new Set(keys.map((d) => d.slice(0, 4)));
        const showYear = opt.year && (yrs.size > 1 || !yrs.has(td.slice(0, 4)));
        return keys.map((d) => {
          const L = by[d].sort((a, b) => (b.ts || 0) - (a.ts || 0));
          let e = 0,
            i = 0;
          for (const t of L) {
            if (D.excl.has(t.c)) continue;
            if (t.t === "e") e += sub(t);
            if (t.t === "i") i += sub(t);
          }
          const dt = parseD(d);
          const md = `${dt.getMonth() + 1}/${dt.getDate()}`;
          const rows = L.map((t) =>
            txRow(t, opt.rowExtra ? Object.assign({ extra: opt.rowExtra(t) }, opt.row) : opt.row),
          ).join("");
          return `<section class="day"><div class="dayhead"><span><b>${showYear ? d.slice(0, 4) + "/" : ""}${md}</b> 週${WD[dt.getDay()]}${d === td ? " · 今天" : ""}</span><span class="dhr"><span>${i ? `<span class="inc num">+${money(i)}</span>　` : ""}${e ? `<span class="exp num">−${money(e)}</span>` : ""}</span>${opt.clear ? `<button class="dclr" data-act="calAll">全月 ×</button>` : ""}${opt.add ? `<button class="dadd" data-act="addOn" data-day="${d}" aria-label="記在 ${md}">＋</button>` : ""}</span></div>${rows}</section>`;
        });
      }
      function dayGroups(list, opt = {}) {
        return dayGroupList(list, opt).join("");
      }
      function monthTx(k) {
        return Object.values(S.months.get(k) || {});
      }

      /* ========== view: home (主頁 — everything is relative to today; no month switcher) ========== */
      // per-day and per-year totals (expense / income without the report-excluded categories, no transfers),
      // the entry count per day, and this year's expense by category — computed once per D and calendar day
      let homeCache = null;
      function homeData() {
        const td = todayStr();
        if (homeCache && homeCache.D === D && homeCache.td === td) return homeCache;
        const byDay = {},
          byYear = {},
          ytdCat = {};
        const y0 = td.slice(0, 4) + "-01-01";
        for (const t of D.tx) {
          const o = byDay[t.d] || (byDay[t.d] = { e: 0, i: 0, n: 0 });
          o.n++;
          if ((t.t !== "e" && t.t !== "i") || D.excl.has(t.c)) continue;
          const v = sub(t),
            y = t.d.slice(0, 4);
          o[t.t] += v;
          const Y = byYear[y] || (byYear[y] = { e: 0, i: 0 });
          Y[t.t] += v;
          if (t.t === "e" && t.d >= y0 && t.d <= td) {
            const c = t.c || "未分類";
            ytdCat[c] = (ytdCat[c] || 0) + v;
          }
        }
        homeCache = { D, td, byDay, byYear, ytdCat };
        return homeCache;
      }
      // totals over an inclusive date range, from the per-day table
      function homeSum(a, b) {
        const H = homeData().byDay,
          o = { e: 0, i: 0, n: 0 };
        for (let d = a; d <= b; d = addDays(d, 1)) {
          const x = H[d];
          if (x) {
            o.e += x.e;
            o.i += x.i;
            o.n += x.n;
          }
        }
        return o;
      }
      // the four periods (to today) and, for each, the previous period of the same length:
      // 今日↔昨日, 本週到今天↔上週同幾天, 本月到今天↔上月 1 日到同一天, 今年到今天↔去年 1/1 到同一天
      function homePeriods() {
        const td = todayStr(),
          ws = +pref("weekStart") === 1 ? 1 : 0;
        const w0 = addDays(td, -((parseD(td).getDay() - ws + 7) % 7));
        const pm = addMonths(mkey(td), -1),
          py = String(+td.slice(0, 4) - 1),
          dd = +td.slice(8);
        const clampD = (k, d) => k + "-" + pad(Math.min(d, daysIn(k)));
        return {
          日: { a: td, b: td, pa: addDays(td, -1), pb: addDays(td, -1), label: "今日", plabel: "昨日" },
          週: { a: w0, b: td, pa: addDays(w0, -7), pb: addDays(td, -7), label: "本週", plabel: "上週同期" },
          月: {
            a: mkey(td) + "-01",
            b: td,
            pa: pm + "-01",
            pb: clampD(pm, dd),
            label: "本月",
            plabel: "上月同期",
          },
          年: {
            a: td.slice(0, 4) + "-01-01",
            b: td,
            pa: py + "-01-01",
            pb: clampD(py + td.slice(4, 7), dd),
            label: "今年",
            plabel: "去年同期",
          },
        };
      }
      // ▲▼ of this period's spending against the previous one (more spending = bad); 「—」 when there is nothing to compare with
      function homeDelta(now, before) {
        if (!(before > 0)) return `<span class="dl flat">—</span>`;
        const pc = Math.round(((now - before) / before) * 100);
        if (Math.abs(pc) < 1) return `<span class="dl flat">持平</span>`;
        const ratio = now / before;
        const txt =
          pc >= 200 ? `×${ratio.toFixed(ratio >= 10 ? 0 : 1)}` : `${pc > 0 ? "▲" : "▼"}${Math.abs(pc)}%`;
        return `<span class="dl ${pc > 0 ? "bad" : "good"}">${txt}</span>`;
      }
      const mdLabel = (d) => `${+d.slice(5, 7)}/${+d.slice(8)}`;
      const rangeLabel = (a, b) => (a === b ? mdLabel(a) : `${mdLabel(a)}–${mdLabel(b)}`);
      // the biggest expenses in a date range
      function homeTop(a, b, n = 5) {
        const out = [];
        for (let k = mkey(a); k <= mkey(b); k = addMonths(k, 1))
          for (const t of monthTx(k))
            if (t.t === "e" && !D.excl.has(t.c) && t.d >= a && t.d <= b) out.push(t);
        return out.sort((x, y) => sub(y) - sub(x)).slice(0, n);
      }
      function viewHome() {
        const page = curSub("home");
        if (!S.hasData && S.mode !== "sample") return noticesHTML() + onboardHTML();
        let h = subtabsHTML("home") + noticesHTML();
        const td = todayStr(),
          P = homePeriods();
        const wan = pref("numFmt") === "wan";
        const fmtN = (n, sign) =>
          wan ? (n < 0 ? "−" : sign && n > 0 ? "+" : "") + short(Math.abs(n)) : money(n, { sign });
        const netHTML = (net) =>
          `<span class="num" style="color:${net < 0 ? "var(--exp)" : "var(--ink)"}">${fmtN(net, true)}</span>`;
        // 「昨日 1,980 ▼37%」 — the previous period's spending and the change against it
        const cmpLine = (p, cur, prev) =>
          `<div class="hcmp" title="${p.plabel}：${rangeLabel(p.pa, p.pb).replace(/–/g, " 到 ")}"><span class="k">${p.plabel}</span>${
            prev.e > 0
              ? `<b class="num">${fmtN(prev.e)}</b>${homeDelta(cur.e, prev.e)}`
              : `<span class="dl flat">—</span><span class="muted">沒有支出</span>`
          }</div>`;
        // the headline card shared by 日／週／月／年: three numbers + the same-length comparison
        const headCard = (key, subtitle) => {
          const p = P[key],
            cur = homeSum(p.a, p.b),
            prev = homeSum(p.pa, p.pb);
          // seven-digit numbers (the 年 page) get the smaller size so three of them fit side by side
          const tight = !wan && Math.max(cur.e, cur.i, Math.abs(cur.i - cur.e)) >= 1e6;
          return `<div class="card"><div class="rowhead"><h3>${p.label}</h3><span class="small muted">${subtitle}</span></div>
    <div class="summary${tight ? " tight" : ""}" style="margin-top:10px"><div><div class="k">支出</div><div class="v num exp">${fmtN(cur.e)}</div></div><div><div class="k">收入</div><div class="v num inc">${fmtN(cur.i)}</div></div><div><div class="k">結餘</div><div class="v">${netHTML(cur.i - cur.e)}</div></div></div>
    ${cmpLine(p, cur, prev)}</div>`;
        };
        const topList = (title, L) =>
          L.length
            ? `<section class="day"><div class="dayhead"><span><b>${title}</b></span></div>${L.map((t) => txRow(t)).join("")}</section>`
            : "";
        const dt = parseD(td);
        if (page === "日") {
          h += headCard("日", `${mdLabel(td)} 週${WD[dt.getDay()]}`);
          const a = addDays(td, -13);
          h += `<div class="card chart"><div class="rowhead"><h3>近 14 天每日支出</h3><span class="small muted">${rangeLabel(a, td)}</span></div><div id="hbars" data-kind="days" style="margin-top:8px"></div><div class="small muted">點任一天的長條，就會到那天的明細</div></div>`;
          const L = monthTx(mkey(td)).filter((t) => t.d === td);
          h += L.length
            ? dayGroups(L)
            : `<div class="card empty">今天還沒有帳。<div class="btnrow" style="justify-content:center;margin-top:12px"><button class="btn sm primary" data-act="addToday">記一筆</button></div></div>`;
          return h;
        }
        if (page === "週") {
          const p = P.週;
          h += headCard("週", `${rangeLabel(p.a, addDays(p.a, 6))}，到今天`);
          h += `<div class="card chart"><div class="rowhead"><h3>本週每日支出</h3><span class="small muted">點長條看那天的帳</span></div><div id="hbars" data-kind="week" style="margin-top:8px"></div></div>`;
          h += `<div class="card chart"><div class="rowhead"><h3>近 8 週支出</h3><span class="small muted">每週合計，本週到今天</span></div><div id="hbars2" data-kind="weeks" style="margin-top:8px"></div></div>`;
          h += topList("本週最大幾筆", homeTop(p.a, p.b));
          return h;
        }
        if (page === "月") {
          const p = P.月;
          h += headCard("月", `${+td.slice(5, 7)} 月 1 日到今天`);
          h += `<div class="card chart"><div class="rowhead"><h3>近 12 個月收支</h3><span class="small muted"><span class="inc">■</span> 收入　<span class="exp">■</span> 支出</span></div><div id="htrend" data-kind="months" style="margin-top:8px"></div><div class="small muted">點任一個月的長條，就會到那個月的明細</div></div>`;
          h += topList("本月最大幾筆", homeTop(p.a, p.b));
          return h;
        }
        if (page === "年") {
          const p = P.年,
            cur = homeSum(p.a, p.b);
          h += headCard("年", `${+td.slice(0, 4)} 年 1 月 1 日到今天`);
          h += `<div class="card chart"><div class="rowhead"><h3>每年收支</h3><span class="small muted"><span class="inc">■</span> 收入　<span class="exp">■</span> 支出</span></div><div id="htrend" data-kind="years" style="margin-top:8px"></div><div class="small muted">點任一年的長條，就會到那一年的報表</div></div>`;
          const rows = Object.entries(homeData().ytdCat)
            .sort((x, y) => y[1] - x[1])
            .slice(0, 5);
          h += `<div class="card"><div class="rowhead"><h3>今年花最多的分類</h3><span class="small muted">到今天</span></div>${
            rows.length
              ? `<div class="legend" style="margin-top:6px">${rows
                  .map(
                    ([n, v]) =>
                      `<button data-hcat="${esc(n)}"><span class="sw" style="background:${catColor("e", n)}"></span><span class="nm">${esc(n)}</span><span class="lv num">${fmtN(v)}</span><span class="meta"><span class="pc">${cur.e ? ((v / cur.e) * 100).toFixed(1) : "0.0"}%</span></span></button>`,
                  )
                  .join(
                    "",
                  )}</div><div class="small muted" style="margin-top:6px">點任一列，就會到報表看那個分類</div>`
              : `<div class="empty">今年還沒有支出</div>`
          }</div>`;
          return h;
        }
        // 總覽: four compact cards (tap → that period's page), then one slim line
        const subs = {
          日: `${mdLabel(td)} 週${WD[dt.getDay()]}`,
          週: rangeLabel(P.週.a, P.週.b),
          月: `${+td.slice(5, 7)} 月，到今天`,
          年: `${+td.slice(0, 4)} 年，到今天`,
        };
        for (const key of ["日", "週", "月", "年"]) {
          const p = P[key],
            cur = homeSum(p.a, p.b),
            prev = homeSum(p.pa, p.pb);
          h += `<button class="card hcard" data-hp="${key}" aria-label="${p.label}收支，看${key}的頁面">
    <div class="hh"><span class="ht">${p.label}</span><span class="small muted">${subs[key]}</span><span class="chev">›</span></div>
    <div class="hbody"><div class="hbig"><span class="k">支出</span><span class="num exp">${fmtN(cur.e)}</span></div><div class="hside"><span class="k">收入</span><b class="num inc">${fmtN(cur.i)}</b><span class="k">結餘</span>${netHTML(cur.i - cur.e)}</div></div>
    ${cmpLine(p, cur, prev)}</button>`;
        }
        const n = (homeData().byDay[td] || {}).n || 0;
        h += `<div class="card slim"><div class="meta-line"><span class="st"${n ? "" : ' style="overflow:visible"'}>${
          n
            ? `連續記帳 <b>${D.streak}</b> 天 · 今天 <b>${n}</b> 筆`
            : `${D.streak ? `連續記帳 <b>${D.streak}</b> 天 · ` : ""}<button class="tapline" data-act="addToday">今天還沒記帳，記一筆 ›</button>`
        }</span></div></div>`;
        return h;
      }
      // 主頁 charts: 日／週 use single-series bars with the trend chart's geometry; 月／年 reuse drawTrend
      function drawHome() {
        const td = todayStr();
        const tr = $("#htrend");
        if (tr) {
          const ks = [];
          if (tr.dataset.kind === "years") {
            const y0 = +(D.first || td).slice(0, 4),
              y1 = +td.slice(0, 4);
            for (let y = y0; y <= y1; y++) ks.push(String(y));
            drawTrend(tr, {
              ks,
              yearly: true,
              label: (k) => "'" + k.slice(2),
              cat: null,
              cur: td.slice(0, 4),
            });
          } else {
            for (let i = 11; i >= 0; i--) ks.push(addMonths(mkey(td), -i));
            drawTrend(tr, { ks, yearly: false, label: (k) => +k.slice(5) + "月", cat: null, cur: mkey(td) });
          }
        }
        for (const el of document.querySelectorAll("#hbars,#hbars2")) {
          const kind = el.dataset.kind,
            H = homeData().byDay,
            items = [];
          if (kind === "days") {
            for (let i = 13; i >= 0; i--) {
              const d = addDays(td, -i);
              items.push({
                d,
                v: (H[d] || {}).e || 0,
                label: String(+d.slice(8)),
                cur: d === td,
                name: mdLabel(d),
              });
            }
          } else if (kind === "week") {
            const w0 = homePeriods().週.a;
            for (let i = 0; i < 7; i++) {
              const d = addDays(w0, i);
              items.push({
                d,
                v: (H[d] || {}).e || 0,
                label: "週" + WD[parseD(d).getDay()],
                cur: d === td,
                future: d > td,
                name: mdLabel(d),
              });
            }
          } else {
            const w0 = homePeriods().週.a;
            for (let i = 7; i >= 0; i--) {
              const a = addDays(w0, -7 * i),
                b = i ? addDays(a, 6) : td;
              items.push({ v: homeSum(a, b).e, label: mdLabel(a), cur: i === 0, name: rangeLabel(a, b) });
            }
          }
          drawHBars(el, items);
        }
      }
      // one expense bar per item ({label, v, cur, future, d, name}); a bar with `d` is tappable (→ 明細›日曆 on that day)
      function drawHBars(el, items) {
        const W = Math.max(300, el.clientWidth),
          H = 200,
          L = 44,
          B = 26,
          T = 10,
          pw = W - L - 4,
          ph = H - B - T;
        const n = items.length,
          bw = pw / n,
          w = Math.min(26, bw * 0.6);
        const top = Math.max(...items.map((it) => it.v));
        // an empty range still gets whole-number ticks (0–6), plus a note in the middle of the plot
        const sc = niceScale(Math.max(6, top)),
          mx = sc.top;
        // label every k-th bar so the texts never touch (the current one is always labelled)
        const tw = (t) => [...String(t)].reduce((a, c) => a + (c > "\x7f" ? 11.5 : 6.6), 0);
        const every = Math.max(1, Math.ceil((Math.max(...items.map((it) => tw(it.label))) + 6) / bw));
        const curIdx = items.findIndex((it) => it.cur);
        let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
        for (let i = 0; i <= sc.n; i++) {
          const y = T + ph - (ph * i) / sc.n;
          s += `<line class="grid" x1="${L}" x2="${W - 4}" y1="${y}" y2="${y}"/>${top > 0 || i === 0 ? `<text x="${L - 6}" y="${y + 4}" text-anchor="end">${short(sc.step * i)}</text>` : ""}`;
        }
        items.forEach((it, i) => {
          const x = L + i * bw,
            hh = (it.v / mx) * ph;
          const tip = `<title>${esc(it.name)}${it.future ? "（還沒到）" : " 支出 " + money(it.v)}</title>`;
          if (!it.future && it.v > 0)
            s += `<rect x="${x + bw / 2 - w / 2}" y="${T + ph - hh}" width="${w}" height="${hh}" rx="2" fill="var(--exp)" opacity="${it.cur ? 1 : 0.7}"/>`;
          s += `<rect class="trendhit"${it.d && !it.future ? ` data-hday="${it.d}"` : ""} x="${x}" y="${T}" width="${bw}" height="${ph + B}" fill="${it.cur ? "var(--accent)" : "transparent"}" style="opacity:${it.cur ? "var(--hilite)" : 0}">${tip}</rect>`;
          if (it.cur || ((n - 1 - i) % every === 0 && (curIdx < 0 || Math.abs(i - curIdx) >= every)))
            s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" ${it.cur ? 'style="fill:var(--ink);font-weight:600"' : it.future ? 'style="opacity:.55"' : ""}>${esc(it.label)}</text>`;
        });
        if (!(top > 0))
          s += `<text x="${L + pw / 2}" y="${T + ph / 2}" text-anchor="middle" style="font-size:13px;font-family:var(--f-body)">這段期間沒有支出</text>`;
        el.innerHTML = s + "</svg>";
      }

      /* ========== view: list ========== */
      // the one notice worth showing right now (sample mode, cloud migration, install hint, backup due,
      // recurring entries due) — shown on 主頁 and 明細; the next one appears once this is handled
      function noticesHTML() {
        const notes = [];
        if (S.mode === "sample")
          notes.push(
            `<div class="banner"><span class="grow"><b>範例資料</b>　這些是虛構帳目，不會儲存。</span><button class="btn sm" data-act="endSample">結束範例</button></div>`,
          );
        if (S.localOffer)
          notes.push(
            `<div class="banner"><span class="grow">這個瀏覽器裡有一份之前存的帳本，要搬到雲端嗎？</span><button class="btn sm primary" data-act="migrate">搬過去</button></div>`,
          );

        if (!standalone && /iPhone|iPad|iPod/.test(navigator.userAgent) && !S.hideInstall)
          notes.push(
            `<div class="banner"><span class="grow">裝成 App：按 Safari 下方的<b>分享</b>，再選<b>「加入主畫面」</b>。</span><button class="btn sm" data-act="hideInstall">知道了</button></div>`,
          );

            notes.push(
              `<div class="banner warn"><span class="grow">${days === null ? "還沒備份過。" : "上次備份是 " + days + " 天前。"}帳只存在這支手機，建議每週備份一次。</span><button class="btn sm" data-act="snooze">稍後</button><button class="btn sm primary" data-act="backup">備份</button></div>`,

        const due = S.mode !== "sample" ? dueRules() : [];
        if (due.length)
          notes.splice(

            0,
            `<div class="banner warn"><span class="grow">${due.length} 筆週期帳目到期：${esc(
              due
                .slice(0, 3)
                .map((r) => r.tpl.s || r.tpl.c || r.tpl.n || "轉帳")
                .join("、"),
            )}${due.length > 3 ? "…" : ""}</span><button class="btn sm primary" data-act="runDue">產生</button></div>`,
          );
        return notes.length ? notes[0] : "";
      }

    ["e", "支出"],

    .map(([p, l]) => `<button data-rtype="${p}" aria-pressed="${R.type === p}">${l}</button>`)

        h += `<div class="card"><div class="rowhead"><h3>${R.drill ? `<button data-act="undrill" class="undrill">‹ 全部分類</button>${esc(R.drill)}` : (R.type === "e" ? "支出" : "收入") + "分類"}</h3><span style="text-align:right"><span class="num ${R.type === "e" ? "exp" : "inc"}" style="font-weight:600">${fmtN(dTotal)}</span>${prevKey && prevTotal ? `<br><span class="small muted">比${prevLabel} </span>${delta(dTotal, prevTotal)}` : ""}</span></div>`;
        if (!rows.length) h += `<div class="empty">這段期間沒有${R.type === "e" ? "支出" : "收入"}</div>`;

      }
      // which bars the trend chart draws for the current period (and drilled category)
      function trendSpec() {

        const rng = (a, b) => `${+a.slice(0, 4)}/${+a.slice(5)}–${+b.slice(0, 4)}/${+b.slice(5)}`;

          title,

          ks,
          title,
          yearly,
          label,

      }
      function donut(parts, total, label) {
        const r = 62,
          C = 2 * Math.PI * r,
          sz = 170;

          .filter((p) => p.v > 0)
          .map((p) => {
            const len = (p.v / total) * C;
            const s = `<circle cx="85" cy="85" r="${r}" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${Math.max(0, len - 1.2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)"/>`;

          })

  <text x="85" y="80" text-anchor="middle" style="fill:var(--muted);font-size:12px;font-family:var(--f-body)">${esc(label.length > 6 ? label.slice(0, 6) + "…" : label)}</text>
  <text x="85" y="100" text-anchor="middle" style="fill:var(--ink);font-size:16px;font-weight:600;font-family:var(--f-num)">${short(total)}</text></svg>`;
      }
      function niceMax(v) {
        if (v <= 0) return 1;
        const p = Math.pow(10, Math.floor(Math.log10(v)));

        return (f <= 1 ? 1 : f <= 2 ? 2 : f <= 2.5 ? 2.5 : f <= 5 ? 5 : 10) * p;

      // a round tick step for a bar chart: 4–6 ticks, the least headroom above `v`
      function niceScale(v) {
        let best = null;
        for (const n of [4, 5, 6]) {
          const step = niceMax(Math.max(1, v) / n),
            top = step * n;
          if (!best || top < best.top) best = { step, n, top };
        }
        return best;
      }
      // monthly / yearly totals for the trend chart; a drilled category draws that category only
      function trendData(TS) {

            o.e += v.e;
            o.i += v.i;
          }

        });
      }
      // el / TS default to the report's trend chart; 主頁 passes its own container and spec ({ks, yearly, label, cur})
      function drawTrend(el = $("#trend"), TS = null) {

        const every = Math.max(1, Math.ceil(30 / bw));
        let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
        for (let i = 0; i <= sc.n; i++) {

          s += `<line class="grid" x1="${L}" x2="${W - 4}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${short(sc.step * i)}</text>`;
        }
        data.forEach((d, i) => {

              he = (d.e / mx) * ph;
            s += `<rect x="${x + bw / 2 - w - 1}" y="${T + ph - hi}" width="${w}" height="${hi}" rx="2" fill="var(--inc)"><title>${name} 收入 ${money(d.i)}</title></rect>`;
            s += `<rect x="${x + bw / 2 + 1}" y="${T + ph - he}" width="${w}" height="${he}" rx="2" fill="var(--exp)"><title>${name} 支出 ${money(d.e)}</title></rect>`;
          }
          s += `<rect class="trendhit" data-month="${ks[i]}" x="${x}" y="${T}" width="${bw}" height="${ph + B}" fill="${isCur ? "var(--accent)" : "transparent"}" style="opacity:${isCur ? "var(--hilite)" : 0}"><title>${name}　收入 ${money(d.i)}　支出 ${money(d.e)}</title></rect>`;
          // the current bar is always labelled; neighbours that would touch it are skipped
          if (isCur || ((n - 1 - i) % every === 0 && (curIdx < 0 || Math.abs(i - curIdx) >= every)))
            s += `<text x="${x + bw / 2}" y="${H - 8}" text-anchor="middle" ${isCur ? 'style="fill:var(--ink);font-weight:600"' : ""}>${TS.label(ks[i])}</text>`;
        });
        el.innerHTML = s + "</svg>";
      }
      function drawNW() {
        const el = $("#nwchart");
        if (!el) return;
        let pts = D.nw.filter((p) => p.k <= addMonths(S.month, 0) || S.rep.period === "a");
        if (S.rep.period !== "a") pts = pts.slice(-36);
        if (pts.length < 2) {
          el.innerHTML = `<div class="empty small">記滿兩個月後會出現走勢圖</div>`;
          return;
        }
        const W = Math.max(300, el.clientWidth),
          H = 190,
          L = 50,
          B = 24,
          T = 12;
        const vs = pts.map((p) => p.v);
        // round ticks: a nice step, then snap the range to it (−500萬, 0, 500萬 … instead of 125萬 steps)
        let lo = Math.min(0, ...vs),
          hi = Math.max(...vs);
        const step = niceMax((hi - lo || 1) / 4);
        lo = Math.floor(lo / step) * step;
        hi = Math.ceil(hi / step) * step;
        if (hi <= lo) hi = lo + step;
        const nTick = Math.round((hi - lo) / step);
        const pw = W - L - 8,
          ph = H - B - T;
        const X = (i) => L + (i / (pts.length - 1)) * pw,
          Y = (v) => T + ph - ((v - lo) / (hi - lo || 1)) * ph;
        let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
        for (let i = 0; i <= nTick; i++) {
          const v = lo + step * i,
            y = Y(v);
          s += `<line class="grid" x1="${L}" x2="${W - 8}" y1="${y}" y2="${y}"/><text x="${L - 6}" y="${y + 4}" text-anchor="end">${short(v)}</text>`;
        }
        const line = pts.map((p, i) => `${i ? "L" : "M"}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
        s += `<path d="${line}L${X(pts.length - 1)},${Y(Math.max(lo, 0))}L${X(0)},${Y(Math.max(lo, 0))}Z" fill="var(--accent)" opacity=".12"/>`;
        s += `<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
        const last = pts[pts.length - 1];
        s += `<circle cx="${X(pts.length - 1)}" cy="${Y(last.v)}" r="4" fill="var(--accent)"/>`;
        // x labels by pixel budget so they never overlap (first/last anchored to the edges)
        const minGap = 44,
          lw = 36, // width of a 「25/08」 label
          maxN = Math.max(2, Math.floor(pw / minGap) + 1);
        const lstep = Math.ceil((pts.length - 1) / (maxN - 1));
        const li = pts.length - 1;
        const box = (i) => {
          const x = X(i);
          return i === 0 ? [x, x + lw] : i === li ? [x - lw, x] : [x - lw / 2, x + lw / 2];
        };
        const cand = pts.map((_, i) => i).filter((i) => i % lstep === 0 && i !== li);
        const idx = [];
        let right = -Infinity;
        for (const i of cand) {
          const [l, r] = box(i);
          if (l < right + 6 || r + 6 > box(li)[0]) continue; // would touch the previous or the last label
          idx.push(i);
          right = r;
        }
        idx.push(li);
        idx.forEach((i) => {
          s += `<text x="${X(i)}" y="${H - 6}" text-anchor="${i === 0 ? "start" : i === li ? "end" : "middle"}">${pts[i].k.slice(2).replace("-", "/")}</text>`;
        });
        el.innerHTML =
          s +
          `</svg><div class="small muted" style="margin-top:4px">最新 <b class="num" style="color:var(--ink)">${money(last.v)}</b>（${last.k.replace("-", "/")}）</div>`;
      }

      // ----- 專案 (報表 sub-page): one card per project; the same numbers openProjects shows, computed once per D -----
      let projCache = null;
      function projectStats() {
        if (projCache && projCache.D === D) return projCache.stats;
        const st = {};
        for (const t of D.tx) {
          if (!t.p) continue;
          const o = st[t.p] || (st[t.p] = { tot: 0, n: 0, from: t.d, to: t.d, cats: {} });
          o.n++;
          if (t.d < o.from) o.from = t.d;
          if (t.d > o.to) o.to = t.d;
          if (t.t === "e") {
            const v = sub(t);
            o.tot += v;
            o.cats[t.c || "未分類"] = (o.cats[t.c || "未分類"] || 0) + v;
          } else if (t.t === "i") o.tot -= sub(t);
        }
        projCache = { D, stats: st };
        return st;
      }
      function projectCardsHTML(fmtN) {
        const P = S.meta.projects || (S.meta.projects = []);
        const st = projectStats();
        // projects that only exist in entries (imports) are listed too, like openProjects does
        for (const n in st) if (!P.find((p) => p.n === n)) P.push({ n });
        const list = P.map((p, i) => ({ p, i, s: st[p.n] })).sort((a, b) => {
          if (!!a.p.done !== !!b.p.done) return a.p.done ? 1 : -1;
          return (b.s ? b.s.to : "") < (a.s ? a.s.to : "") ? -1 : 1;
        });
        let h = `<div class="rowhead acbar"><span class="small muted">${list.length ? `${list.length} 個專案` : "還沒有專案"}</span><button class="btn sm" data-act="projects">新增／管理</button></div>`;
        if (!list.length)
          return (
            h +
            `<div class="card empty">專案可以把一趟旅行、一次裝修的花費集中看，例如「東京五日」「客廳裝修」。<br>記帳時在備註旁選專案，這裡就會出現。</div>`
          );
        const dl = (d) => d.replace(/-0?/g, "/"); // 2024-03-01 → 2024/3/1
        for (const { p, i, s } of list) {
          const cats = s ? Object.entries(s.cats).sort((a, b) => b[1] - a[1]) : [];
          const top = cats.slice(0, 4),
            rest = cats.slice(4).reduce((a, c) => a + c[1], 0);
          if (rest) top.push(["其他分類", rest]);
          const mx = Math.max(1, ...top.map((c) => c[1]));
          h += `<button class="card pcard${p.done ? " done" : ""}" data-proj="${i}" aria-label="專案 ${esc(p.n)}">
    <div class="rowhead"><h3>${esc(p.n)}${p.done ? ' <span class="small muted">已結束</span>' : ""}</h3><span class="num exp" style="font-weight:600">${s ? fmtN(s.tot) : "—"}</span></div>
    <div class="small muted">${s ? `${s.n.toLocaleString()} 筆 · ${dl(s.from)}${s.to !== s.from ? " ～ " + dl(s.to) : ""}` : "還沒有帳"}</div>
    ${top.length ? `<div class="blist pbars">${top.map(([c, v]) => `<div><div class="bh"><span>${esc(c)}</span><span class="num">${fmtN(v)}</span></div><div class="bar"><i style="width:${((v / mx) * 100).toFixed(1)}%;background:${c === "其他分類" ? "var(--line)" : catColor("e", c)}"></i></div></div>`).join("")}</div>` : ""}
    </button>`;
        }
        return h;
      }

      // ----- 更多圖表 (its own sub-page: 分類逐月 / 星期分布 / 帳戶分布, picked with a select) -----
      const MORE_KINDS = [
        ["cat", "分類逐月"],
        ["wd", "星期分布"],
        ["acc", "帳戶分布"],
      ];
      function moreChartsHTML() {
        const kind = lsGet("ledger.moreChartsKind", "cat");
        const R = S.rep;
        const per =
          R.period === "m"
            ? S.month.replace("-", "/")
            : R.period === "y"
              ? +S.month.slice(0, 4) + " 年"
              : "全部期間";
        return `<div class="card chart morecharts" id="moreCharts"><div class="rowhead"><h3>更多圖表</h3><span class="small muted">${per} · ${R.type === "e" ? "支出" : "收入"}</span></div><select class="inp" id="mcKind" aria-label="圖表" style="margin-top:10px">${MORE_KINDS.map(([k, l]) => `<option value="${k}" ${k === kind ? "selected" : ""}>${l}</option>`).join("")}</select><div id="mcChart" style="margin-top:10px"></div></div>`;
      }
      // the days covered by the report period (for the weekday average)
      function periodDays() {
        const P = S.rep.period,
          td = todayStr();
        let a, b;
        if (P === "m") {
          a = S.month + "-01";
          b = S.month + "-" + pad(daysIn(S.month));
        } else if (P === "y") {
          a = S.month.slice(0, 4) + "-01-01";
          b = S.month.slice(0, 4) + "-12-31";
        } else {
          a = D.first || td;
          b = td;
        }
        if (b > td) b = td;
        return [a, b];
      }
      function drawMore() {
        const el = $("#mcChart");
        if (!el) return;
        const kind = lsGet("ledger.moreChartsKind", "cat");
        const R = S.rep,
          ty = R.type;
        const W = Math.max(300, el.clientWidth),
          H = 200,
          L = 44,
          B = 26,
          T = 10,
          pw = W - L - 4,
          ph = H - B - T;
        const axis = (sc) => {
          let s = "";
          for (let i = 0; i <= sc.n; i++) {

          }

        };
        if (kind === "cat") {
          // stacked bars: the period's months (or years), split by main category

            const o = {};
            const add = (mk) => {
              const mc = D.byMonthCat[mk];
              if (!mc) return;
              for (const c in mc[ty]) if (!D.excl.has(c)) o[c] = (o[c] || 0) + mc[ty][c];
            };

          });

          const sums = per.map((o) => Object.values(o).reduce((a, b) => a + b, 0));

              if (!v) continue;

              y -= hh;
              s += `<rect x="${x}" y="${y}" width="${w}" height="${Math.max(0, hh - 0.5)}" fill="${col}"><title>${name} ${esc(c)} ${money(v)}</title></rect>`;
            }

              s += `<text x="${x + w / 2}" y="${H - 8}" text-anchor="middle">${TS.label(ks[i])}</text>`;
          });
          s += `</svg><div class="chips" style="margin-top:8px">${top.map((c) => `<span class="chip small" style="display:inline-flex;align-items:center;gap:6px;min-height:30px"><span class="sw" style="width:10px;height:10px;border-radius:3px;background:${catColor(ty, c)}"></span>${esc(c)}</span>`).join("")}${rest.length ? `<span class="chip small" style="display:inline-flex;align-items:center;gap:6px;min-height:30px"><span class="sw" style="width:10px;height:10px;border-radius:3px;background:var(--line)"></span>其他分類</span>` : ""}</div>`;
          el.innerHTML = s;
        } else if (kind === "wd") {
          // average per weekday over the period (days with no spending count as 0)
          const [a, b] = periodDays();
          const sum = [0, 0, 0, 0, 0, 0, 0],
            cnt = [0, 0, 0, 0, 0, 0, 0];
          for (let d = a; d <= b; d = addDays(d, 1)) cnt[parseD(d).getDay()]++;
          for (const t of periodTx())
            if (t.t === ty && !D.excl.has(t.c) && t.d >= a && t.d <= b) sum[parseD(t.d).getDay()] += sub(t);
          const ws = +pref("weekStart") === 1 ? 1 : 0;
          const order = [0, 1, 2, 3, 4, 5, 6].map((i) => (i + ws) % 7);
          const avg = order.map((wd) => (cnt[wd] ? sum[wd] / cnt[wd] : 0));
          const sc = niceScale(Math.max(1, ...avg)),
            mx = sc.top;
          const bw = pw / 7,
            w = Math.min(30, bw * 0.55);
          let s = `<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">` + axis(sc);
          avg.forEach((v, i) => {
            const x = L + i * bw + bw / 2 - w / 2,
              hh = (v / mx) * ph;
            s += `<rect x="${x}" y="${T + ph - hh}" width="${w}" height="${hh}" rx="2" fill="${ty === "e" ? "var(--exp)" : "var(--inc)"}"><title>週${WD[order[i]]} 平均 ${money(v)}（${cnt[order[i]]} 天）</title></rect>`;

          });

            `</svg><div class="small muted" style="margin-top:4px">每天平均${ty === "e" ? "支出" : "收入"}，${a.replace(/-/g, "/")} 到 ${b.replace(/-/g, "/")}</div>`;
        } else {

          for (const t of periodTx())
            if (t.t === ty && !D.excl.has(t.c)) by[t.acc] = (by[t.acc] || 0) + sub(t);
          const rows = Object.entries(by)
            .sort((a, b) => b[1] - a[1])
            .slice(0, 8);
