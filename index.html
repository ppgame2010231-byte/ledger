<!doctype html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="逐筆帳本">
<meta name="theme-color" content="#EDF0F3" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#11151B" media="(prefers-color-scheme: dark)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon-192.png">
<title>逐筆帳本</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap">
<style>
[hidden]{display:none!important}
img{max-width:100%}
body{margin:0}
:root{padding-top:env(safe-area-inset-top,0px)}
.sbar{position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:var(--bg);z-index:30}
/* Layout: phone-first ledger app — sticky month bar, one scrolling view, bottom tabs, full-height record sheet with calculator keypad */
:root{
  --bg:#EDF0F3; --surface:#FFFFFF; --surface2:#E3E8ED; --line:#D3DAE1;
  --ink:#18212C; --muted:#5C6878; --accent:#2D58A8; --accent-ink:#FFFFFF; --accent-soft:#DCE5F5;
  --exp:#BF4E37; --inc:#23856A; --xfer:#6F65A8; --warn:#B7791F;
  --shadow:0 1px 2px rgba(24,33,44,.06),0 4px 14px rgba(24,33,44,.06);
  --f-body:"Noto Sans TC","PingFang TC","Microsoft JhengHei",system-ui,sans-serif;
  --f-num:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,monospace;
  --tab-h:60px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#11151B; --surface:#1A2029; --surface2:#242C37; --line:#2E3845;
  --ink:#E5EAF0; --muted:#95A2B2; --accent:#82A8F0; --accent-ink:#0F1622; --accent-soft:#22324D;
  --exp:#EF8B74; --inc:#5DC7A1; --xfer:#AAA0E2; --warn:#E3B05A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#11151B; --surface:#1A2029; --surface2:#242C37; --line:#2E3845;
  --ink:#E5EAF0; --muted:#95A2B2; --accent:#82A8F0; --accent-ink:#0F1622; --accent-soft:#22324D;
  --exp:#EF8B74; --inc:#5DC7A1; --xfer:#AAA0E2; --warn:#E3B05A;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 14px rgba(0,0,0,.25); color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:15px/1.5 var(--f-body);-webkit-tap-highlight-color:transparent}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none;padding:0}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.exp{color:var(--exp)} .inc{color:var(--inc)} .xfer{color:var(--xfer)} .muted{color:var(--muted)}
.app{max-width:560px;margin:0 auto;padding:0 16px calc(var(--tab-h) + 96px + env(safe-area-inset-bottom,0px))}

/* top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding-block:10px 8px;margin:0 -16px;padding-inline:16px;display:flex;align-items:center;gap:8px}
.top h1{font-size:17px;font-weight:700;margin:0;flex:1;min-width:0}
.mswitch{display:flex;align-items:center;gap:2px;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:2px}
.mswitch button{width:34px;height:32px;border-radius:999px;font-size:18px;color:var(--muted)}
.mswitch button:hover{background:var(--surface2)}
.mswitch .mlabel{min-width:92px;text-align:center;font-weight:600;font-size:15px;font-family:var(--f-num)}

/* cards */
.card{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);padding:14px 16px}
.stack{display:flex;flex-direction:column;gap:12px}
.summary{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.summary .k{font-size:12px;color:var(--muted);letter-spacing:.04em}
.summary .v{font-size:19px;font-weight:600}
.meta-line{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:12.5px;color:var(--muted);margin-top:10px;padding-top:10px;border-top:1px dashed var(--line)}
.meta-line b{color:var(--ink);font-weight:600;font-family:var(--f-num)}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.over>i{background:var(--exp)}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--accent-soft);font-size:14px}
.banner.warn{background:color-mix(in srgb,var(--warn) 18%,var(--surface))}
.banner .grow{flex:1;min-width:0}

/* day groups */
.day{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.dayhead{display:flex;justify-content:space-between;align-items:baseline;padding:9px 16px 7px;background:var(--surface2);font-size:13px;color:var(--muted)}
.dayhead b{color:var(--ink);font-weight:600;font-family:var(--f-num);font-size:14px}
.tx{display:flex;align-items:center;gap:12px;padding:10px 16px;border-top:1px solid var(--line);width:100%;text-align:left}
.tx:first-of-type{border-top:0}
.tx:hover{background:color-mix(in srgb,var(--surface2) 50%,transparent)}
.badge{flex:none;width:36px;height:36px;border-radius:11px;display:grid;place-items:center;font-weight:700;font-size:15px;color:#fff}
.tx .mid{flex:1;min-width:0}
.tx .t1{font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .t2{font-size:12.5px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tx .amt{font-family:var(--f-num);font-weight:600;font-size:15.5px;white-space:nowrap}
.empty{text-align:center;color:var(--muted);padding:36px 12px}

/* onboarding */
.onboard h2{font-size:19px;margin:0 0 6px;text-wrap:balance}
.onboard p{margin:0 0 14px;color:var(--muted);max-width:60ch}
.btnrow{display:flex;flex-wrap:wrap;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;height:42px;padding:0 16px;border-radius:11px;background:var(--surface2);font-weight:500}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.danger{background:color-mix(in srgb,var(--exp) 14%,var(--surface));color:var(--exp)}
.btn.sm{height:34px;padding:0 12px;font-size:14px;border-radius:9px}
.btn:disabled{opacity:.5;cursor:default}

/* tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--tab-h)}
.tabs button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:12px;color:var(--muted)}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current="true"]{color:var(--accent);font-weight:600}
.fab{position:fixed;z-index:21;right:max(16px,calc(50% - 264px));bottom:calc(var(--tab-h) + 16px + env(safe-area-inset-bottom,0px));width:58px;height:58px;border-radius:18px;background:var(--accent);color:var(--accent-ink);box-shadow:0 6px 18px color-mix(in srgb,var(--accent) 40%,transparent);display:grid;place-items:center}
.fab svg{width:28px;height:28px}

/* segmented */
.seg{display:inline-flex;background:var(--surface2);border-radius:10px;padding:3px;gap:2px}
.seg button{padding:6px 14px;border-radius:8px;font-size:14px;color:var(--muted);font-weight:500}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

/* calendar */
.cal{display:grid;grid-template-columns:repeat(7,1fr);gap:4px}
.cal .wd{font-size:12px;text-align:center;color:var(--muted);padding-bottom:2px}
.cal .c{aspect-ratio:1/1.05;border-radius:10px;padding:4px 3px;display:flex;flex-direction:column;align-items:center;justify-content:space-between;background:var(--surface2);min-width:0}
.cal .c.out{visibility:hidden}
.cal .c .dn{font-size:13px;font-weight:600}
.cal .c .ds,.cal .c .di{display:block}
.cal .c .ds{font-size:10.5px;font-family:var(--f-num);color:var(--exp);white-space:nowrap;overflow:hidden;max-width:100%}
.cal .c .di{font-size:10.5px;font-family:var(--f-num);color:var(--inc);white-space:nowrap;overflow:hidden;max-width:100%}
.cal .c.today{outline:2px solid var(--accent);outline-offset:-2px}
.cal .c.sel{background:var(--accent);color:var(--accent-ink)}
.cal .c.sel .ds,.cal .c.sel .di{color:var(--accent-ink)}

/* reports */
.rowhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rowhead h3{margin:0;font-size:15px}
.legend{display:flex;flex-direction:column}
.legend button{display:grid;grid-template-columns:12px 1fr auto auto;gap:10px;align-items:center;padding:9px 2px;border-top:1px solid var(--line);text-align:left;width:100%}
.legend button:first-child{border-top:0}
.legend .sw{width:12px;height:12px;border-radius:4px}
.legend .pc{font-size:12.5px;color:var(--muted);font-family:var(--f-num);width:52px;text-align:right}
.legend .lv{font-family:var(--f-num);font-weight:600;min-width:80px;text-align:right}
.chart svg{display:block;width:100%;height:auto;overflow:visible}
.chart text{fill:var(--muted);font-family:var(--f-num);font-size:11.5px}
.chart .grid{stroke:var(--line);stroke-width:1}
.donutwrap{display:flex;justify-content:center;padding:6px 0 4px}
.blist{display:flex;flex-direction:column;gap:12px}
.blist .bh{display:flex;justify-content:space-between;font-size:14px;margin-bottom:5px;gap:8px}

/* accounts */
.acgroup h4{margin:0;padding:10px 16px 6px;font-size:12.5px;letter-spacing:.06em;color:var(--muted);font-weight:600;display:flex;justify-content:space-between}
.acrow{display:flex;justify-content:space-between;align-items:center;padding:11px 16px;border-top:1px solid var(--line);width:100%;text-align:left;gap:10px}
.acrow .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.networth{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}

/* more list */
.menu{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.menu button{display:flex;align-items:center;gap:12px;width:100%;padding:13px 16px;border-top:1px solid var(--line);text-align:left}
.menu button:first-child{border-top:0}
.menu .mi{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;flex:none}
.menu .mi svg{width:17px;height:17px}
.menu .ml{flex:1;min-width:0}
.menu .ms{font-size:12.5px;color:var(--muted)}
.chev{color:var(--muted)}

/* sheets */
.sheet{position:fixed;inset:0;z-index:40;background:var(--bg);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);animation:up .18s ease-out}
@keyframes up{from{transform:translateY(24px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion: reduce){.sheet{animation:none}}
.sheet .sh{flex:none;display:flex;align-items:center;gap:8px;padding:8px 12px;max-width:560px;width:100%;margin:0 auto}
.sheet .sh h2{flex:1;margin:0;font-size:17px;text-align:center}
.iconbtn{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.iconbtn:hover{background:var(--surface2)}
.iconbtn svg{width:22px;height:22px}
.sheet .sb{flex:1;overflow:auto;max-width:560px;width:100%;margin:0 auto;padding:4px 16px 24px}
.field{display:flex;flex-direction:column;gap:5px}
.field label,.flabel{font-size:12.5px;color:var(--muted);letter-spacing:.03em}
.inp{height:42px;border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:0 12px;width:100%;min-width:0}
textarea.inp{height:auto;padding:10px 12px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.lst{background:var(--surface);border-radius:14px;box-shadow:var(--shadow);overflow:hidden}
.lst .li{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line)}
.lst .li:first-child{border-top:0}
.lst .li .grow{flex:1;min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{padding:5px 11px;border-radius:999px;background:var(--surface2);font-size:13.5px}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.small{font-size:12.5px}
.progress{height:6px;background:var(--surface2);border-radius:99px;overflow:hidden}
.progress>i{display:block;height:100%;background:var(--accent);width:0;transition:width .2s}
table.prev{border-collapse:collapse;font-size:12.5px;width:100%}
table.prev th,table.prev td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap;text-align:left}
.scrollx{overflow-x:auto}

/* record sheet */
.rec{display:flex;flex-direction:column;flex:1;max-width:560px;width:100%;margin:0 auto;min-height:0}
.rec .rh{display:flex;align-items:center;gap:8px;padding:8px 12px 6px}
.rec .rh .seg{flex:1;display:flex}
.rec .rh .seg button{flex:1}
.amount{display:flex;align-items:center;gap:10px;margin:2px 16px 8px;padding:8px 14px;border-radius:14px;background:var(--surface);box-shadow:var(--shadow)}
.amount .curs{height:32px;border:1px solid var(--line);border-radius:8px;background:var(--surface2);padding:0 4px;font-size:13px}
.amount .disp{flex:1;min-width:0;text-align:right;overflow:hidden}
.amount .expr{font-size:13px;color:var(--muted);font-family:var(--f-num);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;min-height:18px}
.amount .val{font-family:var(--f-num);font-weight:600;font-size:30px;line-height:1.15;white-space:nowrap}
.rate{width:84px;height:32px;font-size:13px}
.catarea{flex:1;min-height:110px;overflow:auto;padding:0 16px}
.freq{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:none}
.freq::-webkit-scrollbar{display:none}
.freq button{flex:none;padding:5px 10px;border-radius:9px;border:1px dashed var(--line);font-size:13px;color:var(--muted);white-space:nowrap}
.mains{display:flex;gap:6px;overflow-x:auto;padding-bottom:8px;scrollbar-width:thin}
.mains button{flex:none;display:flex;align-items:center;gap:6px;padding:5px 11px 5px 5px;border-radius:999px;background:var(--surface);border:1px solid var(--line);font-size:14px;white-space:nowrap}
.mains button .dot{width:24px;height:24px;border-radius:8px;color:#fff;display:grid;place-items:center;font-size:12px;font-weight:700}
.mains button[aria-pressed="true"]{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent);font-weight:600}
.subs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding-bottom:8px}
.subs button{min-height:40px;border-radius:10px;background:var(--surface);border:1px solid var(--line);font-size:14px;padding:4px;line-height:1.25;word-break:break-all}
.subs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.recfields{display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px 16px}
.recfields .inp{height:40px;font-size:14px;padding:0 10px}
.datef{display:flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:10px;background:var(--surface);height:40px;min-width:0}
.datef button{width:30px;height:38px;color:var(--muted);flex:none;font-size:16px}
.datef input{border:0;background:transparent;flex:1;min-width:0;height:38px;font-size:14px;text-align:center;font-family:var(--f-num);padding:0}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;padding:4px 16px 10px}
.keys button{height:46px;border-radius:12px;background:var(--surface);box-shadow:var(--shadow);font-family:var(--f-num);font-size:20px;font-weight:500}
.keys button.op{background:var(--surface2);color:var(--accent)}
.keys .save{grid-column:span 2;background:var(--accent);color:var(--accent-ink);font-family:var(--f-body);font-size:16px;font-weight:700}
.keys .again{background:var(--surface2);font-family:var(--f-body);font-size:14px;font-weight:600;color:var(--ink)}
.keys .del{background:color-mix(in srgb,var(--exp) 14%,var(--surface));color:var(--exp);font-family:var(--f-body);font-size:14px;font-weight:600}
@media (max-height:700px){.keys button{height:40px}.amount .val{font-size:26px}}

.toast{position:fixed;left:50%;bottom:calc(var(--tab-h) + 90px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);z-index:60;background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.confirm{display:flex;flex-direction:column;gap:10px;padding:14px;border-radius:12px;background:color-mix(in srgb,var(--exp) 10%,var(--surface));border:1px solid color-mix(in srgb,var(--exp) 35%,transparent)}
</style>
</head>
<body>

<div class="sbar" aria-hidden="true"></div>
<div class="app" id="app">
  <header class="top">
    <h1 id="viewTitle">明細</h1>
    <div class="mswitch" id="mswitch">
      <button id="mPrev" aria-label="上個月">‹</button>
      <span class="mlabel" id="mLabel">2026/10</span>
      <button id="mNext" aria-label="下個月">›</button>
    </div>
  </header>
  <main id="view" class="stack"><div class="card empty">載入帳本中…</div></main>
</div>

<button class="fab" id="fab" aria-label="記一筆"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg></button>

<nav class="tabs" aria-label="主選單"><div class="in">
  <button data-tab="list" aria-current="true"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1" fill="currentColor"/><circle cx="4" cy="12" r="1" fill="currentColor"/><circle cx="4" cy="18" r="1" fill="currentColor"/></svg>明細</button>
  <button data-tab="cal"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3.5" y="5" width="17" height="15" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/></svg>日曆</button>
  <button data-tab="report"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 3a9 9 0 1 0 9 9h-9z"/><path d="M15 3.5A9 9 0 0 1 20.5 9H15z"/></svg>報表</button>
  <button data-tab="acct"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="3" y="6" width="18" height="13" rx="2.5"/><path d="M3 10h18M16 15h2"/></svg>帳戶</button>
  <button data-tab="more"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="5" cy="12" r="1.4" fill="currentColor"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/><circle cx="19" cy="12" r="1.4" fill="currentColor"/></svg>更多</button>
</div></nav>

<div id="sheets"></div>
<div class="toast" id="toast" hidden></div>

<script>
"use strict";
/* ========== utilities ========== */
const $=s=>document.querySelector(s);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const WD="日一二三四五六";
const pad=n=>String(n).padStart(2,"0");
const ymd=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayStr=()=>ymd(new Date());
const parseD=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const addDays=(s,n)=>{const d=parseD(s);d.setDate(d.getDate()+n);return ymd(d)};
const mkey=s=>s.slice(0,7);
const addMonths=(k,n)=>{let[y,m]=k.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+pad(m)};
const daysIn=k=>{const[y,m]=k.split("-").map(Number);return new Date(y,m,0).getDate()};
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const r2=n=>Math.round(n*100)/100;
function money(n,{sign=false,dec=false}={}){
  if(!isFinite(n))n=0;
  const neg=n<0, a=Math.abs(n);
  const s=a.toLocaleString("en-US",{maximumFractionDigits:dec?2:0,minimumFractionDigits:0});
  return (neg?"−":(sign&&n>0?"+":""))+s;
}
function short(n){const a=Math.abs(n);if(a>=1e8)return (n/1e8).toFixed(1).replace(/\.0$/,"")+"億";if(a>=1e4)return (n/1e4).toFixed(a>=1e6?0:1).replace(/\.0$/,"")+"萬";return Math.round(n).toLocaleString("en-US")}
let toastT;
function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toastT);toastT=setTimeout(()=>t.hidden=true,2600)}
const PALETTE=["#D0674C","#3F7FBF","#2E9A7B","#C4912B","#8A63B8","#C9577F","#4E9FB0","#7C8B3A","#B86E3C","#5C6FC2","#3C8F5A","#A0526E"];
function hue(name){let h=0;for(const ch of String(name))h=(h*31+ch.codePointAt(0))>>>0;return PALETTE[h%PALETTE.length]}
const initial=s=>{s=String(s||"?").replace(/^[\[\(（【][^\]\)）】]*[\]\)）】]/,"").trim()||String(s||"?");return [...s][0]||"?"};

/* ========== data model ========== */
const GROUPS=["現金","銀行","信用卡","電子支付","外幣","投資","資產","負債","其他"];
function defaultMeta(){return{

       {n:"居家",s:["房貸","水電瓦斯","網路","電話費","日用品","家具","管理費"]},
       {n:"娛樂",s:["書籍","漫畫","電影","旅遊","遊戲","訂閱"]},

    i:[{n:"薪資",s:["月薪","獎金","分紅","簽約金"]},

const S={
  mode:"loading",      // loading | cloud | local | sample
  meta:defaultMeta(),
  months:new Map(),    // "YYYY-MM" -> {id:tx}
  db:null, base:null,
  sample:null,         // saved real state while previewing sample
  tab:"list", month:mkey(todayStr()), calDay:null,
  rep:{type:"e",period:"m",drill:null},
  hasData:false
};
let D=null; // derived

function allTx(){const out=[];for(const m of S.months.values())for(const id in m)out.push(m[id]);return out}
function sub(t){return t.v!=null?+t.v:r2((+t.a||0)*(+t.r||1))}   // amount in TWD
function rebuild(){
  const tx=allTx().sort((a,b)=>a.d<b.d?-1:a.d>b.d?1:(a.ts||0)-(b.ts||0));
  const bal={}, byMonth={};
  for(const a of S.meta.accounts)bal[a.name]=+a.init||0;
  const excl=new Set(S.meta.excl||[]);
  const freq={};
  const days=new Set();
  const cutoff=addDays(todayStr(),-120);
  for(const t of tx){
    const v=sub(t);
    if(!(t.acc in bal))bal[t.acc]=0;
    if(t.t==="e")bal[t.acc]-=v;
    else if(t.t==="i")bal[t.acc]+=v;
    else if(t.t==="x"){bal[t.acc]-=v;if(!(t.to in bal))bal[t.to]=0;bal[t.to]+=t.iv!=null?+t.iv:(t.ia!=null?r2(t.ia*t.ir):v)}
    else bal[t.acc]+=v;
    const k=mkey(t.d);
    const M=byMonth[k]||(byMonth[k]={e:0,i:0,n:0,net:0});
    M.n++;
    if(t.t==="e"&&!excl.has(t.c))M.e+=v;
    if(t.t==="i"&&!excl.has(t.c))M.i+=v;
    days.add(t.d);
    if((t.t==="e"||t.t==="i")&&t.d>=cutoff){const fk=t.t+"|"+t.c+"|"+t.s+"|"+t.acc;freq[fk]=(freq[fk]||0)+1}
  }
  // month-end net worth series
  const keys=Object.keys(byMonth).sort();
  const nw=[];
  if(keys.length){
    let run=S.meta.accounts.reduce((s,a)=>s+(+a.init||0),0), i=0;
    let k=keys[0]; const last=mkey(todayStr())>keys[keys.length-1]?mkey(todayStr()):keys[keys.length-1];
    while(k<=last){
      while(i<tx.length&&mkey(tx[i].d)<=k){const t=tx[i],v=sub(t);run+= t.t==="e"?-v:t.t==="i"?v:t.t==="x"?0:v;i++}
      nw.push({k,v:run});k=addMonths(k,1);
    }
  }
  // streak
  let streak=0,dd=todayStr();if(!days.has(dd))dd=addDays(dd,-1);while(days.has(dd)){streak++;dd=addDays(dd,-1)}
  const top=Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,8).map(([k])=>{const[t,c,s,acc]=k.split("|");return{t,c,s,acc}});
  D={tx,bal,byMonth,nw,streak,top,first:tx[0]?.d,count:tx.length,excl};
  S.hasData=tx.length>0;
}

/* ========== persistence ========== */
const LSK="ledger.v1";
const IDB={
  db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{const r=indexedDB.open("ledger",1);r.onupgradeneeded=()=>r.result.createObjectStore("kv");r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error)}))},
  async get(k){const d=await this.open();return new Promise((res,rej)=>{const q=d.transaction("kv").objectStore("kv").get(k);q.onsuccess=()=>res(q.result);q.onerror=()=>rej(q.error)})},
  async put(k,v){const d=await this.open();return new Promise((res,rej)=>{const t=d.transaction("kv","readwrite");t.objectStore("kv").put(v,k);t.oncomplete=()=>res();t.onerror=()=>rej(t.error);t.onabort=()=>rej(t.error)})}
};
const pend=new Set(); let flushing=false; const writing=new Set();
function persist(key){ if(S.mode==="sample"||S.mode==="loading")return; pend.add(key); if(!flushing)flush(); }
async function flush(){
  flushing=true;
  while(pend.size){
    const k=pend.values().next().value; pend.delete(k);
    writing.add(k);
    try{ await writeKey(k) }catch(e){ console.error(e); toast(e&&e.code==="quota_exceeded"?"雲端空間已滿，無法再新增":"儲存失敗，稍後會再試"); if(e&&e.code!=="quota_exceeded"&&e.code!=="invalid_argument"){pend.add(k);await sleep(4000)} }
    writing.delete(k);
  }
  flushing=false;
}
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
async function withRetry(fn){
  for(let i=0;i<6;i++){
    try{return await fn()}catch(e){
      if(e&&(e.code==="resource_exhausted"||e.code==="unavailable")){await sleep(800*(i+1)+Math.random()*400);continue}
      throw e;
    }
  }
  return await fn();
}
async function writeKey(k){
  if(S.mode==="cloud"){
    const col=S.db.collection(S.base);
    if(k==="meta") return withRetry(()=>col.doc("meta").set(JSON.parse(JSON.stringify(S.meta))));
    const m=S.months.get(k);
    if(!m||!Object.keys(m).length) return withRetry(()=>col.doc("m-"+k).delete());
    return withRetry(()=>col.doc("m-"+k).set({k,tx:m}));
  }
  if(S.mode==="local") saveLocal();
}
let localT;
function snapshotState(){const months={};for(const[k,v]of S.months)months[k]=v;return{meta:S.meta,months}}
function saveLocal(now){clearTimeout(localT);const go=async()=>{
  try{await IDB.put("state",JSON.parse(JSON.stringify(snapshotState())))}
  catch(e){console.error(e);toast("手機儲存空間寫入失敗，請先匯出備份")}};
  if(now===true)return go();localT=setTimeout(go,150)}
async function loadLocal(){
  try{let o=await IDB.get("state");
    if(!o){const raw=localStorage.getItem(LSK);if(raw){o=JSON.parse(raw);await IDB.put("state",o)}}
    if(!o)return false;
    S.meta=Object.assign(defaultMeta(),o.meta||{});S.months=new Map(Object.entries(o.months||{}));return true}
  catch(e){console.error(e);return false}
}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="hidden"&&localT){saveLocal(true)}});

async function boot(){
  rebuild(); render();
  if(false){
    S.db=db; S.base="data/users/"+id; S.mode="cloud";
    let first=true, rt=null;
    db.collection(S.base).onSnapshot(snap=>{
      for(const ch of snap.docChanges()){
        const id=ch.doc.id;
        const key=id==="meta"?"meta":id.startsWith("m-")?id.slice(2):null;
        if(!key||pend.has(key)||writing.has(key))continue;
        if(ch.type==="removed"){ if(key!=="meta")S.months.delete(key); continue }
        const data=ch.doc.data(); if(!data)continue;
        if(key==="meta")S.meta=Object.assign(defaultMeta(),JSON.parse(JSON.stringify(data)));
        else S.months.set(key,JSON.parse(JSON.stringify(data.tx||{})));
      }
      clearTimeout(rt); rt=setTimeout(()=>{ if(S.mode==="sample")return; rebuild(); render(); if(first){first=false;S.ready=true;rebuild();render();migrateLocalOffer()} },first?0:120);
    },err=>{ console.warn(err); if(!S.ready){S.mode="local";S.db=null;loadLocal();rebuild();render();toast("雲端暫時連不上，先用這個瀏覽器的儲存")} else toast("雲端同步中斷，重新整理頁面即可恢復") });
  }else{
    await loadLocal(); S.mode="local"; rebuild(); render();
    try{ if(navigator.storage&&navigator.storage.persist) S.persisted=await navigator.storage.persist() }catch(e){}
    if("serviceWorker" in navigator&&location.protocol!=="file:"){ navigator.serviceWorker.register("sw.js").catch(e=>console.warn(e)) }
  }
}
function migrateLocalOffer(){
  // if this browser holds a local ledger and the cloud is empty, offer to move it
  if(S.hasData)return;
  try{const raw=localStorage.getItem(LSK);if(raw){const o=JSON.parse(raw);if(o&&o.months&&Object.keys(o.months).length){S.localOffer=o;render()}}}catch(e){}
}

/* ========== mutations ========== */
function putTx(t,oldD){
  if(oldD&&mkey(oldD)!==mkey(t.d)){const om=S.months.get(mkey(oldD));if(om){delete om[t.id];persist(mkey(oldD))}}
  const k=mkey(t.d); if(!S.months.has(k))S.months.set(k,{});
  S.months.get(k)[t.id]=t; persist(k);
}
function delTx(t){const m=S.months.get(mkey(t.d));if(m){delete m[t.id];if(!Object.keys(m).length)S.months.delete(mkey(t.d));persist(mkey(t.d))}}
function saveMeta(){persist("meta")}
function commit(){rebuild();render()}
function ensureCat(t,c,s){
  if(t!=="e"&&t!=="i"||!c)return;
  const L=S.meta.cats[t];let m=L.find(x=>x.n===c);
  if(!m){m={n:c,s:[]};L.push(m);saveMeta()}
  if(s&&!m.s.includes(s)){m.s.push(s);saveMeta()}
}
function ensureAcc(n){if(n&&!S.meta.accounts.find(a=>a.name===n)){S.meta.accounts.push({name:n,group:guessGroup(n),init:0});saveMeta()}}
function guessGroup(n){
  if(/^\(信\)/.test(n))return"信用卡";
  if(/^\(銀\)/.test(n))return"銀行";
  if(/^\(外\)/.test(n))return"外幣";
  if(/^\(悠\)|^\(icash\)|iPass|Line ?Pay|Edenred|禮券|悠遊|一卡通/i.test(n))return"電子支付";
  if(/^\(分期\)|^借入/.test(n))return"負債";
  if(/^借出|押金/.test(n))return"資產";
  if(/^\(軍\)|皮夾/.test(n))return"現金";
  if(/^\(投\)|^（投）|股|ETF|基金|證券/.test(n))return"投資";
  if(/^\(產\)|^（產）|房|車$/.test(n))return"資產";
  if(/^\(貸\)|^（貸）|貸|借/.test(n))return"負債";
  if(/卡/.test(n))return"信用卡";
  if(/pay|Pay|PAY|悠遊|一卡通|街口|LINE/.test(n))return"電子支付";
  if(/銀行|郵局|帳戶|活存|定存|數位/.test(n))return"銀行";
  if(/現金|錢包|皮夾/.test(n))return"現金";
  return"其他";
}

/* ========== recurring ========== */
function nextDate(rule,from){
  if(rule.f==="d")return addDays(from,1);
  if(rule.f==="w")return addDays(from,7);
  if(rule.f==="y"){const d=parseD(from);d.setFullYear(d.getFullYear()+1);return ymd(d)}
  const k=addMonths(mkey(from),1);const day=Math.min(rule.day||+from.slice(8),daysIn(k));return k+"-"+pad(day);
}
function dueRules(){const t=todayStr();return(S.meta.recurring||[]).filter(r=>r.next&&r.next<=t&&(!r.end||r.next<=r.end))}
function runDue(){
  const t=todayStr();let n=0;
  for(const r of S.meta.recurring||[]){
    let guard=0;
    while(r.next&&r.next<=t&&(!r.end||r.next<=r.end)&&guard++<400){
      putTx(Object.assign({},r.tpl,{id:uid(),d:r.next,ts:Date.now()+n,rec:r.id}));n++;
      r.next=nextDate(r,r.next);
    }
  }
  saveMeta();commit();toast(`已產生 ${n} 筆週期帳目`);
}

/* ========== shared bits ========== */
function txLabel(t){
  if(t.t==="x")return{title:`${t.acc} → ${t.to}`,color:"var(--xfer)",ch:"轉"};
  if(t.t==="a")return{title:t.c||"[轉帳]",color:"var(--xfer)",ch:"轉"};
  return{title:t.s||t.c||"未分類",color:hue(t.c),ch:initial(t.c)};
}
function txRow(t){
  const L=txLabel(t), v=sub(t);
  const cls=t.t==="e"?"exp":t.t==="i"?"inc":"xfer";
  const amt=t.t==="e"?-v:t.t==="i"?v:t.t==="a"?v:v;
  const bits=[];
  if(t.t==="e"||t.t==="i"){ if(t.s&&t.c)bits.push(t.c); bits.push(t.acc) } else if(t.t==="a")bits.push(t.acc);
  if(t.p)bits.push("#"+t.p);
  if(t.n&&!/^\[[^\]]*\]$/.test(t.n.trim()))bits.push(t.n.replace(/\s*\n\s*/g," / "));
  const fx=t.cur&&t.cur!=="TWD"?` <span class="muted small">${esc(t.cur)} ${money(t.a,{dec:true})}</span>`:"";
  return `<button class="tx" data-tx="${esc(t.id)}" data-d="${t.d}">
    <span class="badge" style="background:${L.color}">${esc(L.ch)}</span>
    <span class="mid"><div class="t1">${esc(L.title)}${t.rec?' <span class="muted small">↻</span>':""}</div><div class="t2">${esc(bits.join(" · "))}</div></span>
    <span class="amt ${cls}">${t.t==="x"?"":money(amt,{sign:t.t==="i"||(t.t==="a"&&v>0),dec:true})}${t.t==="x"?money(v,{dec:true}):""}${fx}</span></button>`;
}
function dayGroups(list){
  const by={};for(const t of list)(by[t.d]||(by[t.d]=[])).push(t);
  return Object.keys(by).sort().reverse().map(d=>{
    const L=by[d].sort((a,b)=>(b.ts||0)-(a.ts||0));
    let e=0,i=0;for(const t of L){if(D.excl.has(t.c))continue;if(t.t==="e")e+=sub(t);if(t.t==="i")i+=sub(t)}
    const dt=parseD(d);
    return `<section class="day"><div class="dayhead"><span><b>${dt.getMonth()+1}/${dt.getDate()}</b> 週${WD[dt.getDay()]}${d===todayStr()?" · 今天":""}</span><span>${i?`<span class="inc num">+${money(i)}</span>　`:""}${e?`<span class="exp num">−${money(e)}</span>`:""}</span></div>${L.map(txRow).join("")}</section>`;
  }).join("");
}

/* ========== view: reports ========== */
function periodTx(){

function donut(parts,total,label){
  const r=62,C=2*Math.PI*r,sz=170;let off=0;
  const segs=parts.filter(p=>p.v>0).map(p=>{const len=p.v/total*C;const s=`<circle cx="85" cy="85" r="${r}" fill="none" stroke="${p.c}" stroke-width="22" stroke-dasharray="${Math.max(0,len-1.2)} ${C}" stroke-dashoffset="${-off}" transform="rotate(-90 85 85)"/>`;off+=len;return s}).join("");
  return `<svg width="${sz}" height="${sz}" viewBox="0 0 170 170" role="img" aria-label="${esc(label)}圓餅圖"><circle cx="85" cy="85" r="${r}" fill="none" stroke="var(--surface2)" stroke-width="22"/>${segs}
  <text x="85" y="80" text-anchor="middle" style="fill:var(--muted);font-size:12px;font-family:var(--f-body)">${esc(label.length>6?label.slice(0,6)+"…":label)}</text>
  <text x="85" y="100" text-anchor="middle" style="fill:var(--ink);font-size:16px;font-weight:600;font-family:var(--f-num)">${short(total)}</text></svg>`;
}
function niceMax(v){if(v<=0)return 1;const p=Math.pow(10,Math.floor(Math.log10(v)));const f=v/p;return(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function drawTrend(){
  const el=$("#trend");if(!el)return;
  const W=Math.max(300,el.clientWidth), H=210, L=44, B=26, T=10;
  const ks=[];for(let i=11;i>=0;i--)ks.push(addMonths(S.month,-i));
  const data=ks.map(k=>D.byMonth[k]||{e:0,i:0});
  const mx=niceMax(Math.max(1,...data.map(d=>Math.max(d.e,d.i))));
  const pw=W-L-4, ph=H-B-T, bw=pw/12;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  for(let i=0;i<=4;i++){const y=T+ph-ph*i/4;s+=`<line class="grid" x1="${L}" x2="${W-4}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${short(mx*i/4)}</text>`}
  data.forEach((d,i)=>{const x=L+i*bw, w=Math.min(14,bw*0.32);
    const hi=d.i/mx*ph, he=d.e/mx*ph;
    s+=`<rect x="${x+bw/2-w-1}" y="${T+ph-hi}" width="${w}" height="${hi}" rx="2" fill="var(--inc)"><title>${ks[i]} 收入 ${money(d.i)}</title></rect>`;
    s+=`<rect x="${x+bw/2+1}" y="${T+ph-he}" width="${w}" height="${he}" rx="2" fill="var(--exp)"><title>${ks[i]} 支出 ${money(d.e)}</title></rect>`;
    if(bw>=24||i%2===(11%2))s+=`<text x="${x+bw/2}" y="${H-8}" text-anchor="middle" ${ks[i]===S.month?'style="fill:var(--ink);font-weight:600"':""}>${+ks[i].slice(5)}月</text>`;
  });
  el.innerHTML=s+"</svg>";
}
function drawNW(){
  const el=$("#nwchart");if(!el)return;
  let pts=D.nw.filter(p=>p.k<=addMonths(S.month,0)||S.rep.period==="a");
  if(S.rep.period!=="a")pts=pts.slice(-36);
  if(pts.length<2){el.innerHTML=`<div class="empty small">資料累積兩個月以上會出現走勢</div>`;return}
  const W=Math.max(300,el.clientWidth),H=190,L=50,B=24,T=12;
  const vs=pts.map(p=>p.v);let lo=Math.min(0,...vs),hi=Math.max(...vs);
  const span=niceMax(hi-lo||1);hi=lo<0?Math.ceil(hi/(span/4))*(span/4):niceMax(hi);lo=lo<0?Math.floor(lo/(span/4))*(span/4):0;
  const pw=W-L-8,ph=H-B-T;
  const X=i=>L+i/(pts.length-1)*pw, Y=v=>T+ph-(v-lo)/(hi-lo||1)*ph;
  let s=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}">`;
  for(let i=0;i<=4;i++){const v=lo+(hi-lo)*i/4,y=Y(v);s+=`<line class="grid" x1="${L}" x2="${W-8}" y1="${y}" y2="${y}"/><text x="${L-6}" y="${y+4}" text-anchor="end">${short(v)}</text>`}
  const line=pts.map((p,i)=>`${i?"L":"M"}${X(i).toFixed(1)},${Y(p.v).toFixed(1)}`).join("");
  s+=`<path d="${line}L${X(pts.length-1)},${Y(Math.max(lo,0))}L${X(0)},${Y(Math.max(lo,0))}Z" fill="var(--accent)" opacity=".12"/>`;
  s+=`<path d="${line}" fill="none" stroke="var(--accent)" stroke-width="2.2" stroke-linejoin="round"/>`;
  const last=pts[pts.length-1];s+=`<circle cx="${X(pts.length-1)}" cy="${Y(last.v)}" r="4" fill="var(--accent)"/>`;
  const step=Math.ceil(pts.length/6);
  pts.forEach((p,i)=>{if(i%step===0||i===pts.length-1&&(pts.length-1)%step>step/2)s+=`<text x="${X(i)}" y="${H-6}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}">${p.k.slice(2).replace("-","/")}</text>`});
  el.innerHTML=s+`</svg><div class="small muted" style="margin-top:4px">最新 <b class="num" style="color:var(--ink)">${money(last.v)}</b>（${last.k.replace("-","/")}）</div>`;
}

function lastRate(cur){for(let i=D.tx.length-1;i>=0;i--)if(D.tx[i].cur===cur&&D.tx[i].r)return D.tx[i].r;return 1}
function evalExpr(s){
  if(!s)return 0;
  s=s.replace(/[+\-×÷.]+$/,"");
  const tk=s.match(/\d*\.?\d+|\d+\.|[+\-×÷]/g)||[];
  const nums=[],ops=[];
  let expectNum=true,neg=false;
  for(const t of tk){
    if(/[+\-×÷]/.test(t)){ if(expectNum){if(t==="-")neg=!neg;continue} ops.push(t);expectNum=true }
    else{ nums.push((neg?-1:1)*parseFloat(t)); neg=false; expectNum=false }
  }
  // × ÷ first
  const n2=[nums[0]??0],o2=[];
  for(let i=0;i<ops.length;i++){const b=nums[i+1];if(b===undefined)break;
    if(ops[i]==="×")n2[n2.length-1]*=b; else if(ops[i]==="÷")n2[n2.length-1]=b?n2[n2.length-1]/b:0; else{o2.push(ops[i]);n2.push(b)}}
  let v=n2[0];for(let i=0;i<o2.length;i++)v=o2[i]==="+"?v+n2[i+1]:v-n2[i+1];
  return r2(v);
}

}

function renameEverywhere(field,from,to){
  for(const[k,m]of S.months){let ch=false;for(const id in m){const t=m[id];
    if(field==="acc"){if(t.acc===from){t.acc=to;ch=true}if(t.to===from){t.to=to;ch=true}}
    else if(field==="cat"){if(t.c===from&&(t.t===to.t)){t.c=to.n;ch=true}}
    else if(field==="sub"){if(t.c===to.c&&t.s===from&&t.t===to.t){t.s=to.n;ch=true}}
    else if(field==="proj"){if(t.p===from){t.p=to;ch=true}}}
    if(ch)persist(k)}
  for(const r of S.meta.recurring||[]){const t=r.tpl;if(field==="acc"){if(t.acc===from)t.acc=to;if(t.to===from)t.to=to}if(field==="proj"&&t.p===from)t.p=to}
}

    api.body.querySelectorAll("[data-st]").forEach(b=>b.onclick=()=>{st.t=b.dataset.st;api.refresh()});
    run();setTimeout(()=>g("#sq").focus(),60);
  });

/* ========== CSV import ========== */
function decodeBuf(buf){
  const b=new Uint8Array(buf);let enc="utf-8",off=0;
  if(b[0]===0xFF&&b[1]===0xFE){enc="utf-16le";off=2}
  else if(b[0]===0xFE&&b[1]===0xFF){enc="utf-16be";off=2}
  else if(b[0]===0xEF&&b[1]===0xBB&&b[2]===0xBF){enc="utf-8";off=3}
  else{let z0=0,z1=0;const n=Math.min(b.length,2000);for(let i=0;i<n;i++)if(!b[i])(i%2?z1++:z0++);
    if(z1>n/8)enc="utf-16le";else if(z0>n/8)enc="utf-16be";
    else{try{new TextDecoder("utf-8",{fatal:true}).decode(b);enc="utf-8"}catch(e){enc="big5"}}}
  return{text:new TextDecoder(enc).decode(b.subarray(off)),enc};
}
function parseDelimited(text){
  const first=text.split(/\r?\n/,1)[0]||"";
  const delim=(first.match(/\t/g)||[]).length>=(first.match(/,/g)||[]).length?"\t":",";
  const rows=[];let row=[],f="",q=false;
  for(let i=0;i<text.length;i++){const c=text[i];
    if(q){if(c==='"'){if(text[i+1]==='"'){f+='"';i++}else q=false}else f+=c}
    else if(c==='"'&&f==="")q=true;
    else if(c===delim){row.push(f);f=""}
    else if(c==="\n"||c==="\r"){if(c==="\r"&&text[i+1]==="\n")i++;row.push(f);f="";if(row.some(x=>x!==""))rows.push(row);row=[]}
    else f+=c}
  row.push(f);if(row.some(x=>x!==""))rows.push(row);
  return{rows,delim};
}
const HDR={d:["日期","date","時間"],type:["類別","類型","收支","type"],c:["主分類","分類","category"],s:["子分類","次分類","subcategory"],acc:["帳戶","account"],p:["專案","project"],a:["金額","amount"],r:["匯率","rate"],sub:["小計","subtotal"],n:["備註","說明","memo","note"],cur:["幣別","貨幣","currency"]};
function normDate(s){s=String(s).trim();const m=s.match(/(\d{4})[\/\-.年](\d{1,2})[\/\-.月](\d{1,2})/);if(m)return m[1]+"-"+pad(+m[2])+"-"+pad(+m[3]);const m2=s.match(/^(\d{4})(\d{2})(\d{2})/);if(m2)return m2[1]+"-"+m2[2]+"-"+m2[3];return null}
const numv=s=>{const v=parseFloat(String(s??"").replace(/[,\s$NT]/g,""));return isFinite(v)?v:NaN};
/* ---- CWMoney format: verified against a real 22k-row export ----
   Columns: 日期 類別 主分類 子分類 帳戶 專案 金額 匯率 小計 建檔時間 GPS 地址 發票號碼 轉帳 備註 (+ trailing tab)
   - every field quoted, notes may contain line breaks, LF line endings, UTF-16LE with BOM
   - 類別 is always 支出/收入; amounts are always positive
   - a transfer is two rows with blank 主分類: 支出 leg (from) + 收入 leg (to), same 建檔時間 */
const CW_HEAD=["日期","類別","主分類","子分類","帳戶","專案","金額","匯率","小計","建檔時間","GPS","地址","發票號碼","轉帳","備註"];
const CW_NOPROJ="無特別專案";
const FX_BY_ACC=[[/美金|美元|USD/i,"USD"],[/日幣|日圓|日元|JPY/i,"JPY"],[/澳門/,"MOP"],[/港幣|HKD/i,"HKD"],[/人民幣|CNY/i,"CNY"],[/歐元|EUR/i,"EUR"],[/韓元|KRW/i,"KRW"]];
function fxName(acc){for(const[re,c]of FX_BY_ACC)if(re.test(acc))return c;return"外幣"}
function ctToMs(ct){const m=String(ct).match(/^(\d{2})\/(\d{2})\/(\d{2}) (\d{2}):(\d{2}):(\d{2})/);return m?Date.UTC(2000+ +m[1],m[2]-1,+m[3],+m[4],+m[5],+m[6]):NaN}
function nowCT(){const d=new Date();return `${String(d.getFullYear()).slice(2)}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`}
function interpretCSV(text){
  const{rows,delim}=parseDelimited(text);
  if(!rows.length)throw new Error("檔案是空的");
  const head=rows[0].map(h=>h.trim().replace(/^﻿/,""));
  const idx={};for(const k in HDR){idx[k]=head.findIndex(h=>HDR[k].some(a=>h.toLowerCase()===a.toLowerCase()))}
  for(const[k,n]of[["ct","建檔時間"],["gps","GPS"],["addr","地址"],["inv","發票號碼"],["xf","轉帳"]])idx[k]=head.indexOf(n);
  let body=rows.slice(1);
  if(idx.d<0&&normDate(rows[0][0])){Object.assign(idx,{d:0,type:1,c:2,s:3,acc:4,p:5,a:6,r:7,sub:8,ct:9,gps:10,addr:11,inv:12,xf:13,n:14,cur:-1});body=rows}
  if(idx.d<0||idx.a<0&&idx.sub<0)throw new Error("找不到「日期」或「金額」欄位");
  const get=(r,k)=>idx[k]>=0?(r[idx[k]]??""):"";
  const isCW=idx.ct>=0;
  // pass 1: rows -> raw legs, file order kept (CWMoney lists newest first)
  const raw=[];let bad=0;
  for(const r of body){
    const d=normDate(get(r,"d"));let a=numv(get(r,"a"));const v=numv(get(r,"sub"));let rate=numv(get(r,"r"));
    if(!isFinite(a)&&isFinite(v)){a=v;rate=1}
    if(!d||!isFinite(a)){bad++;continue}
    if(!isFinite(rate)||rate<=0)rate=isFinite(v)&&a?Math.abs(v/a):1;
    const type=get(r,"type").trim(), c=get(r,"c").trim();
    raw.push({d,type,c,s:get(r,"s").trim(),acc:get(r,"acc").trim()||"未指定帳戶",p:get(r,"p").trim(),a,r:rate,v:isFinite(v)?v:a*rate,
      n:get(r,"n"),ct:get(r,"ct"),as:get(r,"a"),rs:get(r,"r"),vs:get(r,"sub"),gps:get(r,"gps"),addr:get(r,"addr"),inv:get(r,"inv"),cur:get(r,"cur").trim()});
  }
  const isX=x=>/轉帳/.test(x.type)||/^\[.*\]$/.test(x.c)||!x.c;
  const neg=x=>/支出|轉出/.test(x.type)||(!/收入|轉入/.test(x.type)&&x.a<0);
  let en=0,ep=0;for(const x of raw)if(!isX(x)&&!/收入/.test(x.type)){if(x.a<0)en++;else if(x.a>0)ep++}
  const sign=en>ep?"signed":"positive";
  // pass 2: oldest first so ts preserves the file's own order exactly
  raw.reverse();
  const out=[];const used=new Set();let paired=0;
  const pend={}; // transfer legs waiting for a partner, keyed by date+建檔時間
  raw.forEach((x,i)=>{x.i=i});
  const mkExtra=(t,x,isXfer)=>{
    if(x.ct)t.ct=x.ct;
    if(isCW){ if(x.gps!==(isXfer?"":"0,0"))t.gps=x.gps; if(x.addr)t.addr=x.addr; if(x.inv)t.inv=x.inv;
      // keep the original text of a number when our formatting would not reproduce it
      if(x.as!==cwNum(Math.abs(x.a)))t.as=x.as; if(x.rs!==cwNum(x.r))t.rs=x.rs; if(x.vs!==cwSub(Math.abs(x.v)))t.vs=x.vs; }
  };
  for(const x of raw){
    const xfer=isX(x);
    const t={id:"",d:x.d,acc:x.acc,ts:x.i+1};
    if(xfer){
      t.t="a";const s=neg(x)?-1:1;
      t.a=s*Math.abs(x.a);t.r=x.r;t.v=s*Math.abs(x.v);
      t.c=/^\[.*\]$/.test(x.c)?x.c:(/^\[.*\]$/.test((x.n||"").trim())?x.n.trim():"[轉帳]");
      t.n=x.n||"";
      if(x.p&&x.p!==CW_NOPROJ)t.p=x.p;
      if(x.r!==1)t.cur=fxName(x.acc);
      mkExtra(t,x,true);
      t._k=x.d+"|"+x.ct;t._s=s;
    }else{
      t.t=/收入/.test(x.type)?"i":/支出/.test(x.type)?"e":(x.a<0?"e":"i");
      t.a=Math.abs(x.a);t.c=x.c;if(x.s)t.s=x.s;
      if(x.p&&x.p!==CW_NOPROJ)t.p=x.p;
      if(x.n)t.n=x.n;
      if(x.r!==1){t.r=x.r;t.cur=x.cur&&x.cur!=="TWD"&&x.cur!=="NTD"?x.cur:fxName(x.acc)}
      if(Math.abs(Math.abs(x.v)-r2(Math.abs(x.a)*x.r))>1e-9)t.v=Math.abs(x.v);
      mkExtra(t,x,false);
    }
    out.push(t);
  }
  // pass 3: pair the 支出 leg and 收入 leg of each transfer (same day, same 建檔時間, same NT$ value, different accounts)
  const groups={};out.forEach((t,i)=>{if(t.t==="a"&&isCW&&t.ct)(groups[t._k]||(groups[t._k]=[])).push(i)});
  const drop=new Set();
  for(const k in groups){const L=groups[k];
    for(const i of L){if(drop.has(i)||out[i]._s>0||out[i]._x)continue;
      const o=out[i];
      const j=L.find(j=>!drop.has(j)&&!out[j]._x&&j!==i&&out[j]._s>0&&Math.abs(Math.abs(out[j].v)-Math.abs(o.v))<0.005&&out[j].acc!==o.acc&&(out[j].n||"")===(o.n||"")&&(out[j].p||"")===(o.p||""));
      if(j===undefined)continue;
      const n=out[j];
      // merged transfer: from o.acc to n.acc; keep both legs' original amounts and row order
      const x={id:"",d:o.d,t:"x",acc:o.acc,to:n.acc,a:Math.abs(o.a),ts:o.ts,its:n.ts,ct:o.ct};
      if(o.r!==1){x.r=o.r;x.cur=o.cur}
      if(Math.abs(o.v)!==r2(Math.abs(o.a)*(o.r||1)))x.v=Math.abs(o.v);
      if(Math.abs(n.a)!==Math.abs(o.a)||n.r!==o.r){x.ia=Math.abs(n.a);x.ir=n.r;if(Math.abs(n.v)!==r2(Math.abs(n.a)*n.r))x.iv=Math.abs(n.v)}
      x.n=o.n||""; if(o.p)x.p=o.p;
      for(const f of["gps","addr","inv","as","rs","vs"]){if(o[f]!==undefined)x[f]=o[f];if(n[f]!==undefined)x["i"+f]=n[f]}
      out[i]=x;out[i]._x=1;drop.add(j);paired++;
    }}
  const out2=out.filter((t,i)=>!drop.has(i)).map(t=>{delete t._k;delete t._s;delete t._x;return t});
  const seq={};
  for(const t of out2){seq[t.d]=(seq[t.d]||0)+1;t.id="i"+t.d.replace(/-/g,"")+"-"+seq[t.d].toString(36)}
  return{tx:out2,paired,bad,sign,delim,head,rows:raw.length,positiveXfer:false};
}
/* CWMoney-compatible export: same columns, quoting, ordering and number style, UTF-16LE + BOM, LF */
function cwNum(n){ // 金額／匯率: plain, no grouping
  if(!isFinite(n))return"0";const s=String(+(+n).toPrecision(15));return s.includes("e")?(+n).toFixed(6).replace(/\.?0+$/,""):s}
function cwSub(n){ // 小計: thousands grouping, up to 4 decimals
  return (+n).toLocaleString("en-US",{maximumFractionDigits:4,minimumFractionDigits:0})}
function buildCWExport(list){
  const q=s=>'"'+String(s??"").replace(/"/g,'""')+'"';
  const line=a=>a.map(q).join("\t")+"\t";
  const D=d=>d.replace(/-/g,"/");
  const ctOf=t=>t.ct||(()=>{const d=new Date(t.ts||Date.now());return `${String(d.getFullYear()).slice(2)}/${pad(d.getMonth()+1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`})();
  const P=t=>t.p||CW_NOPROJ;
  const rowsOut=[];const add=(d,ts,l)=>rowsOut.push({d,ts,l});
  for(const t of list){
    const r=t.r||1, ct=ctOf(t);
    if(t.t==="e"||t.t==="i"){
      const v=t.v!=null?t.v:r2(t.a*r);
      add(t.d,t.ts,line([D(t.d),t.t==="e"?"支出":"收入",t.c,t.s||"",t.acc,P(t),t.as??cwNum(t.a),t.rs??cwNum(r),t.vs??cwSub(v),ct,t.gps??"0,0",t.addr??"",t.inv??"","",t.n??""]));
    }else if(t.t==="x"){
      const ov=t.v!=null?t.v:r2(t.a*r);
      const ia=t.ia??t.a, ir=t.ir??r, iv=t.iv!=null?t.iv:(t.ia!=null?r2(ia*ir):ov);
      const outL=line([D(t.d),"支出","","",t.acc,P(t),t.as??cwNum(t.a),t.rs??cwNum(r),t.vs??cwSub(ov),ct,t.gps??"",t.addr??"",t.inv??"","",t.n??"[轉帳]"]);
      const inL=line([D(t.d),"收入","","",t.to,P(t),t.ias??cwNum(ia),t.irs??cwNum(ir),t.ivs??cwSub(iv),ct,t.igps??"",t.iaddr??"",t.iinv??"","",t.n??"[轉帳]"]);
      add(t.d,t.ts||0,outL);add(t.d,t.its!=null?t.its:(t.ts||0)+0.5,inL); // new transfers: 收入 leg listed first, like CWMoney
    }else{
      const v=t.v!=null?Math.abs(t.v):r2(Math.abs(t.a)*r);
      add(t.d,t.ts,line([D(t.d),t.a<0?"支出":"收入","","",t.acc,P(t),t.as??cwNum(Math.abs(t.a)),t.rs??cwNum(r),t.vs??cwSub(v),ct,t.gps??"",t.addr??"",t.inv??"","",t.n??t.c??"[轉帳]"]));
    }
  }
  rowsOut.sort((a,b)=>a.d<b.d?1:a.d>b.d?-1:(b.ts||0)-(a.ts||0));
  return [CW_HEAD.join("\t")+"\t",...rowsOut.map(r=>r.l)].join("\n")+"\n";
}

async function doImport(P,mode,prog){
  if(S.mode==="sample")endSample(true);
  const months=new Map(mode==="replace"?[]:[...S.months].map(([k,v])=>[k,Object.assign({},v)]));
  let skipped=0;
  const sig=t=>[t.d,t.t,t.a,t.acc,t.c,t.s||"",t.n||""].join("|");
  const seen=new Set();if(mode==="append")for(const m of months.values())for(const id in m)seen.add(sig(m[id]));
  for(const t of P.tx){if(mode==="append"&&seen.has(sig(t))){skipped++;continue}
    const k=mkey(t.d);if(!months.has(k))months.set(k,{});const m=months.get(k);let id=t.id;while(m[id])id+="x";t.id=id;m[id]=t}
  // categories & accounts
  const count={e:{},i:{}};
  for(const t of P.tx)if(t.t==="e"||t.t==="i"){const o=count[t.t][t.c]||(count[t.t][t.c]={n:0,s:{}});o.n++;if(t.s)o.s[t.s]=(o.s[t.s]||0)+1}
  const build=ty=>Object.entries(count[ty]).sort((a,b)=>b[1].n-a[1].n).map(([n,o])=>({n,s:Object.entries(o.s).sort((a,b)=>b[1]-a[1]).map(x=>x[0])}));
  if(mode==="replace"){
    const keepB=S.meta.budgets,keepR=S.meta.recurring,keepX=S.meta.excl;
    const oldAcc=new Map(S.meta.accounts.map(a=>[a.name,a]));
    const accN=[...new Set(P.tx.map(t=>t.acc))];
    const lastUse={};for(const t of P.tx)lastUse[t.acc]=t.d;
    const stale=addDays(todayStr(),-540);
    S.meta=Object.assign(defaultMeta(),{budgets:keepB,recurring:keepR,excl:keepX,sign:P.sign,projects:[...new Set(P.tx.filter(t=>t.p).map(t=>t.p))].map(n=>({n}))});
    S.meta.accounts=accN.map(n=>oldAcc.get(n)||{name:n,group:guessGroup(n),init:0,hidden:lastUse[n]<stale?true:undefined});
    const ce=build("e"),ci=build("i");if(ce.length)S.meta.cats.e=ce;if(ci.length)S.meta.cats.i=ci;
  }else{
    for(const t of P.tx){ensureAcc(t.acc);ensureCat(t.t,t.c,t.s);if(t.p&&!S.meta.projects.find(p=>p.n===t.p))S.meta.projects.push({n:t.p})}
  }
  const oldKeys=[...S.months.keys()];
  S.months=months;
  rebuild();
  if(S.mode==="local"){prog(.5,"寫入手機儲存空間…");await saveLocal(true);prog(1,"完成");return}
  // cloud: write meta + each month doc sequentially
  const keys=[...months.keys()].sort();
  const dels=mode==="replace"?oldKeys.filter(k=>!months.has(k)):[];
  const total=keys.length+dels.length+1;let done=0;
  const col=S.db.collection(S.base);
  writing.add("meta");
  try{
    await withRetry(()=>col.doc("meta").set(JSON.parse(JSON.stringify(S.meta))));done++;
    for(const k of keys){writing.add(k);await withRetry(()=>col.doc("m-"+k).set({k,tx:months.get(k)}));writing.delete(k);done++;prog(done/total,`寫入 ${k}（${done}/${total}）`)}
    for(const k of dels){await withRetry(()=>col.doc("m-"+k).delete());done++;prog(done/total,"清理舊月份")}
  }finally{writing.clear()}
  prog(1,skipped?`完成，跳過 ${skipped} 筆重複`:"完成");
}

/* ========== export / backup ========== */
async function offerFile(filename,data,onDone){
  const type=filename.endsWith(".json")?"application/json":"text/csv";
  const blob=data instanceof Blob?new Blob([data],{type}):new Blob([data],{type});
  const file=new File([blob],filename,{type});
  if(navigator.canShare&&navigator.canShare({files:[file]})){
    try{await navigator.share({files:[file],title:filename});onDone&&onDone();toast("已送出");return}
    catch(e){if(e&&e.name==="AbortError")return;}
  }
  const url=URL.createObjectURL(blob);const a=document.createElement("a");a.href=url;a.download=filename;document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(url),30000);onDone&&onDone();toast("已匯出 "+filename);
}
function utf16le(str){const buf=new Uint8Array(2+str.length*2);buf[0]=0xFF;buf[1]=0xFE;for(let i=0;i<str.length;i++){const c=str.charCodeAt(i);buf[2+i*2]=c&255;buf[3+i*2]=c>>8}return buf}
function doExport(){
  if(!D.count){toast("還沒有帳目可以匯出");return}
  offerFile(`CSV_${todayStr().replace(/-/g,"_")}_CHT.CSV`,new Blob([utf16le(buildCWExport(D.tx))]));
}
function doBackup(){
  const months={};for(const[k,v]of S.months)months[k]=v;
  offerFile(`帳本備份_${todayStr().replace(/-/g,"")}.json`,JSON.stringify({app:"逐筆帳本",v:1,at:new Date().toISOString(),meta:S.meta,months}),()=>{S.meta.lastBackup=todayStr();saveMeta();if(S.tab==="list")render()});
}
function openRestore(){
  openSheet("從備份還原",api=>{
    api.body.innerHTML=`<div class="stack"><div class="card stack"><span>選擇之前「完整備份」存下的 JSON 檔（例如在 iCloud 雲碟裡）。目前的資料會被備份內容取代。</span><input type="file" id="rIn" accept=".json,application/json" class="inp" style="padding:8px"><div id="rBox"></div></div></div>`;
    api.body.querySelector("#rIn").onchange=async e=>{const f=e.target.files[0];if(!f)return;
      try{const o=JSON.parse(await f.text());if(!o.meta||!o.months)throw new Error("不是這個帳本的備份檔");
        const n=Object.values(o.months).reduce((s,m)=>s+Object.keys(m).length,0);
        api.body.querySelector("#rBox").innerHTML=`<div class="confirm"><span>備份含 ${n.toLocaleString()} 筆帳目（${esc(o.at?.slice(0,10)||"")}）。還原會取代目前 ${D.count.toLocaleString()} 筆。</span><div class="btnrow"><button class="btn danger" id="rGo">還原</button></div><div class="progress" hidden id="rProg"><i></i></div></div>`;
        api.body.querySelector("#rGo").onclick=async()=>{
          if(S.mode==="sample")endSample(true);
          const old=[...S.months.keys()];S.meta=Object.assign(defaultMeta(),o.meta);S.months=new Map(Object.entries(o.months));rebuild();
          if(S.mode==="local"){await saveLocal(true)}else{
            const col=S.db.collection(S.base);const keys=[...S.months.keys()];const pr=api.body.querySelector("#rProg");pr.hidden=false;
            await withRetry(()=>col.doc("meta").set(JSON.parse(JSON.stringify(S.meta))));
            let i=0;for(const k of keys){await withRetry(()=>col.doc("m-"+k).set({k,tx:S.months.get(k)}));pr.firstChild.style.width=(++i/keys.length*100)+"%"}
            for(const k of old)if(!S.months.has(k))await withRetry(()=>col.doc("m-"+k).delete());
          }
          api.close();render();toast("已還原");
        };
      }catch(err){toast("無法讀取："+err.message)}};
  });
}
async function migrateLocal(){
  const o=S.localOffer;S.localOffer=null;
  S.meta=Object.assign(defaultMeta(),o.meta);S.months=new Map(Object.entries(o.months));
  persist("meta");for(const k of S.months.keys())persist(k);
  commit();toast("已搬到雲端，這頁換裝置也看得到了");
}

/* ========== sample data ========== */
function startSample(){
  S.sample={mode:S.mode,meta:S.meta,months:S.months};
  S.mode="sample";S.meta=defaultMeta();S.months=new Map();
  S.meta.accounts.push({name:"(投)0050",group:"投資",init:0},{name:"(貸)房貸",group:"負債",init:-11500000},{name:"(產)自住房",group:"資產",init:13000000});
  S.meta.projects=[{n:"範例・東京週末"}];
  S.meta.budgets={total:30000,cats:{"飲食":9000,"娛樂":4000}};
  let seed=7;const rnd=()=>(seed=(seed*16807)%2147483647)/2147483647;
  const pick=a=>a[Math.floor(rnd()*a.length)];
  const t0=todayStr();let k=addMonths(mkey(t0),-5);
  const add=t=>{const kk=mkey(t.d);if(!S.months.has(kk))S.months.set(kk,{});t.id=uid()+Math.floor(rnd()*1e6);t.ts=Date.parse(t.d)+Math.floor(rnd()*1e5);S.months.get(kk)[t.id]=t};
  add({d:addMonths(mkey(t0),-6)+"-28",t:"a",a:265000,acc:"華南銀行",c:"[期初]"});
  while(k<=mkey(t0)){
    const n=k===mkey(t0)?+t0.slice(8):daysIn(k);
    for(let d=1;d<=n;d++){const ds=k+"-"+pad(d);
      if(rnd()<.8)add({d:ds,t:"e",a:Math.round(50+rnd()*60),acc:"現金",c:"飲食",s:"早餐",n:"範例"});
      if(rnd()<.6)add({d:ds,t:"e",a:Math.round(120+rnd()*180),acc:pick(["現金","富邦信用卡"]),c:"飲食",s:"晚餐",n:"範例"});
      if(rnd()<.15)add({d:ds,t:"e",a:Math.round(150+rnd()*100),acc:"中信信用卡",c:"交通",s:"加油"});
      if(rnd()<.08)add({d:ds,t:"e",a:Math.round(300+rnd()*900),acc:"富邦信用卡",c:pick(["娛樂","購物"]),s:pick(["書籍","3C","生活用品","電影"])});
    }
    add({d:k+"-05",t:"i",a:85000,acc:"華南銀行",c:"薪資",s:"月薪",n:"範例"});
    add({d:k+"-05",t:"e",a:20000,acc:"華南銀行",c:"其他",s:"家用",n:"孝親費（範例）"});
    if(k+"-06"<=t0){add({d:k+"-06",t:"e",a:23055,acc:"華南銀行",c:"居家",s:"房貸"});add({d:k+"-06",t:"x",a:10000,acc:"華南銀行",to:"(投)0050",n:"定期定額"})}
    if(k+"-12"<=t0)add({d:k+"-12",t:"x",a:Math.round(6000+rnd()*4000),acc:"華南銀行",to:pick(["富邦信用卡","中信信用卡"]),n:"繳卡費"});
    if(k+"-15"<=t0)add({d:k+"-15",t:"e",a:990,acc:"富邦信用卡",c:"學習",s:"AI 服務"});
    k=addMonths(k,1);
  }
  const pk=addMonths(mkey(t0),-2);
  add({d:pk+"-14",t:"e",a:6800,acc:"富邦信用卡",c:"娛樂",s:"旅遊",p:"範例・東京週末",n:"機票"});
  add({d:pk+"-15",t:"e",a:5400,acc:"富邦信用卡",c:"娛樂",s:"旅遊",p:"範例・東京週末",n:"住宿"});
  add({d:pk+"-15",t:"e",a:2100,acc:"現金",c:"飲食",s:"晚餐",p:"範例・東京週末",cur:"JPY",r:.215,n:"居酒屋"});
  S.meta.recurring=[{id:"r1",tpl:{t:"e",a:20000,acc:"華南銀行",c:"其他",s:"家用",n:"孝親費"},f:"m",day:5,next:addMonths(mkey(t0),1)+"-05"}];
  S.month=mkey(t0);commit();toast("已載入範例資料");
}
function endSample(silent){
  if(!S.sample)return;Object.assign(S,{mode:S.sample.mode,meta:S.sample.meta,months:S.sample.months,sample:null});
  commit();if(silent!==true)toast("已結束範例");
}

boot();
</script>
