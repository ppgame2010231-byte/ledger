          el.innerHTML = rows.length
            ? `<div class="blist">${rows.map(([n, v]) => `<div><div class="bh"><span>${esc(dispAcc(n))}</span><span class="num">${money(v)}</span></div><div class="bar"><i style="width:${((v / mx) * 100).toFixed(1)}%;background:${ty === "e" ? "var(--exp)" : "var(--inc)"}"></i></div></div>`).join("")}</div>`
            : `<div class="empty small">這段期間沒有${ty === "e" ? "支出" : "收入"}</div>`;
        }
      }

      /* ========== view: accounts ========== */
      const UP_I =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 14l6-6 6 6"/></svg>';
      const DOWN_I =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 10l6 6 6-6"/></svg>';

      const acctCollapsed = () => {

          h += `<div class="card"><div class="networth"><div><div class="small muted">資產</div><div class="num inc v">${fmtN(pos)}</div></div><div><div class="small muted">負債</div><div class="num exp v">${fmtN(-neg)}</div></div><div><div class="small muted">淨資產</div><div class="num v">${fmtN(pos + neg)}</div></div></div>${

      // every chart checks for its own container, so this is safe to call on any page

      function findTx(id, d) {

      /* ========== sheets ========== */
      const XI =
        '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';

      function openSheet(title, build, { back = false } = {}) {

      // drag the header of a sheet downwards to close it (iOS-style)
      function pullDown(el, onClose) {
        let y0 = null,
          x0 = 0;
        el.addEventListener(
          "touchstart",
          (e) => {
            if (!e.target.closest(".sh,.rh,.grab")) {
              y0 = null;
              return;
            }
            y0 = e.touches[0].clientY;
            x0 = e.touches[0].clientX;
            el.style.transition = "none";
          },
          { passive: true },
        );
        el.addEventListener(
          "touchmove",
          (e) => {
            if (y0 === null) return;
            const dy = e.touches[0].clientY - y0;
            if (dy > 0) el.style.transform = `translateY(${Math.min(dy, 220)}px)`;
          },

          "touchend",
          (e) => {
            if (y0 === null) return;
            const dy = e.changedTouches[0].clientY - y0,

            y0 = null;
            el.style.transition = "transform .18s ease-out";
            if (dy > 90 && dx < 80) {

      /* ----- record sheet (the main recording screen) ----- */
      // weight of one past entry for "what do you usually record at this hour"
      function timeW(x, h, cut30) {
        const hh = x.ct ? parseInt(x.ct.slice(9, 11), 10) : NaN;
        let w = 0.05;
        if (!isNaN(hh)) {
          const dh = Math.min(Math.abs(hh - h), 24 - Math.abs(hh - h));
          w += dh === 0 ? 3 : dh === 1 ? 1.5 : dh === 2 ? 0.5 : 0;
        }
        if (x.d >= cut30) w *= 1.5;
        return w;
      }
      // combos you usually record at this time of day (uses each entry's creation time)
      function suggestFor(t) {
        const h = new Date().getHours(),
          cut = addDays(todayStr(), -180),
          cut30 = addDays(todayStr(), -30),
          sc = {};
        for (let i = D.tx.length - 1; i >= 0; i--) {
          const x = D.tx[i];
          if (x.d < cut) break;
          if (x.t !== t || !x.c || x.rec) continue;
          const k = x.c + "|" + (x.s || "") + "|" + x.acc;
          sc[k] = (sc[k] || 0) + timeW(x, h, cut30);
        }
        return Object.entries(sc)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 6)
          .map(([k, score]) => {
            const [c, s, acc] = k.split("|");
            return { t, c, s, acc, score };
          });
      }
      // the sub-category this main is most used with at this hour ("" when it has no history)
      function subFor(t, c) {
        const h = new Date().getHours(),
          cut = addDays(todayStr(), -180),
          cut30 = addDays(todayStr(), -30),
          sc = {};
        for (let i = D.tx.length - 1; i >= 0; i--) {
          const x = D.tx[i];
          if (x.d < cut) break;
          if (x.t !== t || x.c !== c || !x.s || x.rec) continue;
          sc[x.s] = (sc[x.s] || 0) + timeW(x, h, cut30);
        }
        const best = Object.entries(sc).sort((a, b) => b[1] - a[1])[0];
        return best ? best[0] : "";
      }
      // notes you have used before for this category
      function notesFor(t, c, s) {
        const cut = addDays(todayStr(), -365),
          cnt = {};
        for (let i = D.tx.length - 1; i >= 0; i--) {
          const x = D.tx[i];
          if (x.d < cut) break;
          if (x.t !== t || x.c !== c || (s && x.s !== s) || !x.n) continue;
          const n = String(x.n).split("\n")[0].trim();
          if (!n || n.length > 24 || /^\[.*\]$/.test(n)) continue;
          cnt[n] = (cnt[n] || 0) + 1;
        }
        return Object.entries(cnt)
          .sort((a, b) => b[1] - a[1])
          .slice(0, 8)
          .map((e) => e[0]);
      }
      // short: 0 = 「今天 10/6（二）」, 1 = drop the weekday, 2 = drop 「今天」 too
      function dateLabel(d, short = 0) {
        const t = todayStr();
        const rel =
          d === t
            ? "今天 "
            : d === addDays(t, -1)
              ? "昨天 "
              : d === addDays(t, 1)
                ? "明天 "
                : d === addDays(t, -2)
                  ? "前天 "
                  : "";
        const x = parseD(d);
        const md = `${d.slice(0, 4) !== t.slice(0, 4) ? d.slice(0, 4) + "/" : ""}${x.getMonth() + 1}/${x.getDate()}`;
        if (short >= 2) return md;
        if (short === 1) return `${rel}${md}`;
        return `${rel}${md}（${WD[x.getDay()]}）`;
      }
      // the currency an account is kept in: "USD" for 美金, "" for a TWD account, null for an unknown foreign one
      function accCur(name) {
        const a = S.meta.accounts.find((x) => x.name === name);
        if (a && a.cur !== undefined) return a.cur === "TWD" ? "" : a.cur || "";
        const hit = FX_BY_ACC.find(([re]) => re.test(name || ""));
        if (hit) return hit[1];
        return a && a.group === "外幣" ? null : "";
      }
      // money in an account's own currency: "US$1,234.56", "¥12,000"; TWD accounts fall back to money()
      const CUR_SYM = {
        USD: "US$",
        JPY: "¥",
        EUR: "€",
        CNY: "CN¥",
        HKD: "HK$",
        KRW: "₩",
        GBP: "£",
        AUD: "A$",
        SGD: "S$",
        MOP: "MOP$",
        THB: "฿",
        CAD: "C$",
        NZD: "NZ$",
        VND: "₫",
        MYR: "RM",
        PHP: "₱",
        IDR: "Rp",
      };
      function moneyN(cur, n, opt = {}) {
        if (!cur) return money(n, opt);
        const sym = CUR_SYM[cur] || cur + " ";
        const whole = cur === "JPY" || cur === "KRW" || cur === "VND" || cur === "IDR";
        const s = money(n, Object.assign({ dec: !whole }, opt));
        return s.startsWith("−") || s.startsWith("+") ? s[0] + sym + s.slice(1) : sym + s;
      }
      // what an account page shows as its balance: native for a foreign account, else TWD
      function accBalText(name) {
        const c = accCur(name);
        return c && D.balN && name in D.balN ? moneyN(c, D.balN[name]) : money(D.bal[name] || 0);
      }
      function openRecord(tx, preset = {}) {
        if (S.mode === "sample") {
          toast("這是範例，先按上面的「結束範例」再記帳");
          return;
        }
        const editing = !!tx;
        // 簡易／完整 sheet: the toggle on this device wins, then the Settings default (pref recMode),
        // then the first-run decision: a ledger that already has entries keeps the full sheet it knows,
        // a fresh install starts simple. The decision is stored so a later import does not flip it.
        const recMode = () => {
          const dev = lsGet("ledger.recMode", null);
          if (dev === "simple" || dev === "full") return dev;
          const p = pref("recMode");
          if (p === "simple" || p === "full") return p;
          let init = lsGet("ledger.recModeInit", null);
          if (init !== "simple" && init !== "full") {
            init = D.count > 0 ? "full" : "simple";
            lsSet("ledger.recModeInit", init);
          }
          return init;
        };
        let mode = recMode();
        const lastAcc = lsGet("ledger.lastAcc", null);
        const visible = (n) => !!n && S.meta.accounts.some((a) => a.name === n && !a.hidden);
        const startAcc = () => {
          const dflt = pref("defaultAcc");
          if (pref("accMode") === "default" && visible(dflt)) return dflt;
          if (visible(lastAcc)) return lastAcc;
          if (visible(dflt)) return dflt;
          return (S.meta.accounts.find((a) => !a.hidden) || S.meta.accounts[0] || {}).name || "現金";
        };
        const curDefault = pref("defaultCur") || "TWD";
        const R = {
          t: "e",
          expr: "",
          c: "",
          s: "",
          acc: startAcc(),
          to: "",
          d: todayStr(),
          p: "",
          n: "",
          cur: curDefault,
          r: 1,
        };
        if (tx)
          Object.assign(R, {
            t: tx.t,
            expr: String(Math.abs(+tx.a)),
            c: tx.c || "",
            s: tx.s || "",
            acc: tx.acc,
            to: tx.to || "",
            d: tx.d,
            p: tx.p || "",
            n: tx.n || "",
            cur: tx.cur || "TWD",
            r: tx.r || 1,
            neg: tx.t === "a" && +tx.a < 0,
          });
        Object.assign(R, preset); // 復原／複製 reopen with the values as they were
        const expr0 = R.expr; // amount as opened: unchanged → tx.a is written back untouched
        if (!tx && !preset.cur && R.cur !== "TWD") R.r = lastRate(R.cur);
        R.fresh = !!R.expr; // the first digit replaces the amount shown (A-04)
        R.curTouched = !!preset.cur && preset.cur !== curDefault;
        if (!R.c && (R.t === "e" || R.t === "i") && !tx) {
          const mode = pref("preselect");
          if (mode === "suggest") {
            const sg = suggestFor(R.t);
            if (
              sg[0] &&
              sg[0].score >= 2 * (sg[1] ? sg[1].score : 0) &&
              S.meta.cats[R.t].some((c) => c.n === sg[0].c)
            ) {
              R.c = sg[0].c;
              R.s = sg[0].s;
              R.guess = true;
              if (!preset.acc && pref("accMode") !== "default" && visible(sg[0].acc)) R.acc = sg[0].acc;
            }
          } else if (mode === "last") {
            for (let i = D.tx.length - 1; i >= 0; i--) {
              const x = D.tx[i];
              if (x.t === R.t && x.c && S.meta.cats[R.t].some((c) => c.n === x.c)) {
                R.c = x.c;
                R.s = x.s || "";
                break;
              }
            }
          }
        }
        if (R.t === "x" && !R.to)
          R.to = (S.meta.accounts.find((a) => a.name !== R.acc && !a.hidden) || {}).name || "";
        // 更多 row (專案／幣別／匯率): open when something in it is set, or the project pref says so
        const activeProj = () => (S.meta.projects || []).filter((p2) => !p2.done);
        const projUsedRecently = () => {
          const cut = addDays(todayStr(), -90),
            act = new Set(activeProj().map((p2) => p2.n));
          if (!act.size) return false;
          for (let i = D.tx.length - 1; i >= 0; i--) {
            if (D.tx[i].d < cut) break;
            if (D.tx[i].p && act.has(D.tx[i].p)) return true;
          }
          return false;
        };
        const projMode = pref("projField");
        const showProj = () => (R.t === "e" || R.t === "i") && (projMode !== "never" || !!R.p);
        R.moreOpen =
          (projMode === "always" && activeProj().length > 0) || (projMode === "auto" && projUsedRecently());
        let confirmDel = false;
        let drawnTops = [],
          drawnNotes = [],
          drawnPairs = []; // what the chips showed when drawn; clicks use these, never a recomputed list
        const el = document.createElement("div");
        el.className = "sheet";
        el.setAttribute("role", "dialog");
        el.setAttribute("aria-label", editing ? "編輯帳目" : "記一筆");
        $("#sheets").appendChild(el);
        document.body.style.overflow = "hidden";
        document.body.classList.add("rec-open");
        const close = () => {
          el.remove();
          document.body.classList.remove("rec-open");
          document.body.style.overflow = $("#sheets").children.length ? "hidden" : "";
        };
        // account <select>: 「常用」 (top 5 of the last 90 days) first, then the user's groups; no balances in the option text
        const accOpts = (sel) => {
          const opt = (a) =>
            `<option value="${esc(a.name)}"${a.name === sel ? " selected" : ""}>${esc(dispAcc(a.name))}</option>`;
          let o = "";
          const used = new Set();
          if (pref("accRecent")) {
            const cut = addDays(todayStr(), -90),
              cnt = {};
            for (let i = D.tx.length - 1; i >= 0; i--) {
              const x = D.tx[i];
              if (x.d < cut) break;
              cnt[x.acc] = (cnt[x.acc] || 0) + 1;
              if (x.to) cnt[x.to] = (cnt[x.to] || 0) + 1;
            }
            const top = Object.entries(cnt)
              .sort((a, b) => b[1] - a[1])
              .map(([n]) => S.meta.accounts.find((a) => a.name === n && !a.hidden))
              .filter(Boolean)
              .slice(0, 5);
            if (top.length) {
              o += `<optgroup label="常用">${top.map(opt).join("")}</optgroup>`;
              top.forEach((a) => used.add(a.name));
            }
          }
          for (const g of accountsByGroup({ selected: sel })) {
            const L = g.accounts.filter((a) => !used.has(a.name));
            if (L.length) o += `<optgroup label="${esc(g.group)}">${L.map(opt).join("")}</optgroup>`;
          }
          if (sel && !S.meta.accounts.find((a) => a.name === sel))
            o += `<option value="${esc(sel)}" selected>${esc(sel)}</option>`;
          return o;
        };
        const balText = (name) => (name in D.bal ? short(D.bal[name] || 0) : "");
        // the account you usually pay this category with
        function accFor(t, c, s2) {
          const cut = addDays(todayStr(), -180),
            cnt = {};
          for (let i = D.tx.length - 1; i >= 0; i--) {
            const x = D.tx[i];
            if (x.d < cut) break;
            if (x.t !== t || x.c !== c || (s2 && x.s !== s2)) continue;
            cnt[x.acc] = (cnt[x.acc] || 0) + 1;
          }
          const best = Object.entries(cnt).sort((a, b) => b[1] - a[1])[0];
          return best && S.meta.accounts.some((a) => a.name === best[0] && !a.hidden) ? best[0] : null;
        }
        function autoAcc() {
          if (R.accTouched || editing || !pref("autoAcc")) return;
          const a = accFor(R.t, R.c, R.s);
          if (a) R.acc = a;
          followAcc();
        }
        // a foreign-currency account (外幣 group, or 美金／日幣… in its name) brings its currency and last rate along
        function followAcc() {
          if (editing || R.curTouched) return;
          const c = accCur(R.acc);
          if (c) {
            if (R.cur !== c) {
              R.cur = c;
              R.r = lastRate(c);
              R.moreTouched = false; // show the rate again even if the row had been collapsed
            }
            R.curAuto = true;
          } else if (c === "" && R.curAuto) {
            R.cur = curDefault;
            R.r = curDefault === "TWD" ? 1 : lastRate(curDefault);
            R.curAuto = false;
            R.moreTouched = false;
          }
        }
        if (!editing) followAcc();
        // the most frequent transfer pairs of the last 90 days (both accounts still visible)
        function xferPairs() {
          const cut = addDays(todayStr(), -90),
            cnt = {};
          for (let i = D.tx.length - 1; i >= 0; i--) {
            const x = D.tx[i];
            if (x.d < cut) break;
            if (x.t !== "x" || !x.to) continue;
            const k = x.acc + "|" + x.to;
            cnt[k] = (cnt[k] || 0) + 1;
          }
          return Object.entries(cnt)
            .sort((a, b) => b[1] - a[1])
            .map(([k]) => {
              const [acc, to] = k.split("|");
              return { acc, to };
            })
            .filter((p2) => visible(p2.acc) && visible(p2.to))
            .slice(0, 4);
        }
        // this month so far for the chosen category, shown while typing the amount
        function catContext() {
          if (R.t !== "e" || !R.c) return "";
          const k = mkey(R.d);

      function evalExpr(s) {
        if (!s) return 0;
        s = s.replace(/[+\-×÷.]+$/, "");
        const tk = s.match(/\d*\.?\d+|\d+\.|[+\-×÷]/g) || [];
        const nums = [],
          ops = [];
        let expectNum = true,
          neg = false;
        for (const t of tk) {
          if (/[+\-×÷]/.test(t)) {
            if (expectNum) {
              if (t === "-") neg = !neg;
              continue;
            }
            ops.push(t);
            expectNum = true;
          } else {
            nums.push((neg ? -1 : 1) * parseFloat(t));
            neg = false;
            expectNum = false;
          }
        }
        // × ÷ first
        const n2 = [nums[0] ?? 0],
          o2 = [];
        for (let i = 0; i < ops.length; i++) {
          const b = nums[i + 1];
          if (b === undefined) break;
          if (ops[i] === "×") n2[n2.length - 1] *= b;
          else if (ops[i] === "÷") n2[n2.length - 1] = b ? n2[n2.length - 1] / b : 0;
          else {
            o2.push(ops[i]);
            n2.push(b);
          }
        }
        let v = n2[0];
        for (let i = 0; i < o2.length; i++) v = o2[i] === "+" ? v + n2[i + 1] : v - n2[i + 1];
        return r2(v);

              if (v === "-0" || v === "0") v = v.replace("0", ""); // a 0 account: just leave the sign to type after

      function renameEverywhere(field, from, to) {
        for (const [k, m] of S.months) {
          let ch = false;
          for (const id in m) {
            const t = m[id];
            if (field === "acc") {
              if (t.acc === from) {
                t.acc = to;
                ch = true;
              }
              if (t.to === from) {
                t.to = to;
                ch = true;
              }
            } else if (field === "cat") {
              if (t.c === from && t.t === to.t) {
                t.c = to.n;
                ch = true;
              }
            } else if (field === "sub") {
              if (t.c === to.c && t.s === from && t.t === to.t) {
                t.s = to.n;
                ch = true;
              }
            } else if (field === "proj") {
              if (t.p === from) {
                t.p = to;
                ch = true;
              }
            }
          }
          if (ch) persist(k);
        }
        for (const r of S.meta.recurring || []) {
          const t = r.tpl;
          if (field === "acc") {
            if (t.acc === from) t.acc = to;
            if (t.to === from) t.to = to;
          }
          if (field === "proj" && t.p === from) t.p = to;
          if (field === "cat" && t.t === to.t && t.c === from) t.c = to.n;
          if (field === "sub" && t.t === to.t && t.c === to.c && t.s === from) t.s = to.n;
        }
        if (field === "cat") {
          // report exclusions and budgets follow the main category
          const X = S.meta.excl || [];
          const i = X.indexOf(from);
          if (i >= 0 && !X.includes(to.n)) X[i] = to.n;
          const B = S.meta.budgets && S.meta.budgets.cats;
          if (B && B[from] !== undefined && B[to.n] === undefined) {
            B[to.n] = B[from];
            delete B[from];
          }
        }
        if (field === "acc") {
          if (pref("defaultAcc") === from) setPref("defaultAcc", to);
          if (lsGet("ledger.lastAcc") === from) lsSet("ledger.lastAcc", to);
        }
      }

            rng = {};
          for (const t of D.tx)
            if (t.p) {

              rng[t.p] = rng[t.p] || [t.d, t.d];

      /* ----- search ----- */
      // lowercase search text per transaction, cached while D is the same object
      let hayD = null,
        hayMap = new Map();

        if (hayD !== D) {

          hayMap = new Map();
        }
        let h = hayMap.get(t.id);
        if (!h || h.t !== t) {
          h = { t, s: [t.c, t.s, t.acc, t.to, t.p, t.n].join(" ").toLowerCase() };
          hayMap.set(t.id, h);
        }
        return h.s;
      }
      function openSearch() {
        const st = {
          q: "",
          t: "all",
          min: "",
          max: "",
          from: "",
          to: "",
          acc: "",
          c: "",
          s: "",
          more: false,

        let R = [],
          shownN = 100;
        openSheet("搜尋", (api) => {

          const catOpts = (ty) =>
            ((S.meta.cats && S.meta.cats[ty]) || []).map((c) => o(c.n, c.n, st.c === c.n)).join("");
          const mainCat = (
            st.t === "e" || st.t === "i" ? S.meta.cats[st.t] : [...S.meta.cats.e, ...S.meta.cats.i]
          ).find((c) => c.n === st.c);
          api.body.innerHTML = `<div class="stack"><input class="inp" id="sq" placeholder="搜尋備註、分類、帳戶…" value="${esc(st.q)}" enterkeyhint="search" autocomplete="off">
      <div class="chips schips">${[
        ["all", "全部"],
        ["e", "支出"],
        ["i", "收入"],
        ["x", "轉帳"],

        .join("")}</div>
      <details class="sdetails" id="sMore" ${st.more ? "open" : ""}><summary>更多條件</summary><div class="stack">
      <div class="grid2"><input class="inp num" id="smin" placeholder="最低金額" inputmode="decimal" value="${st.min}" aria-label="最低金額"><input class="inp num" id="smax" placeholder="最高金額" inputmode="decimal" value="${st.max}" aria-label="最高金額"></div>
      <div class="grid2"><input class="inp" type="date" id="sfrom" value="${st.from}" aria-label="開始日期"><input class="inp" type="date" id="sto" value="${st.to}" aria-label="結束日期"></div>
      <select class="inp" id="sacc" aria-label="帳戶">${o("", "全部帳戶", !st.acc)}${accountsByGroup({
        includeHidden: true,
      })
        .map(
          (gp) =>
            `<optgroup label="${esc(gp.group)}">${gp.accounts.map((a) => o(a.name, dispAcc(a.name) + (a.hidden ? "（已隱藏）" : ""), st.acc === a.name)).join("")}</optgroup>`,
        )
        .join("")}</select>
      ${
        st.t === "x"
          ? ""
          : `<div class="grid2"><select class="inp" id="scat" aria-label="主分類">${o("", "全部分類", !st.c)}${
              st.t === "e" || st.t === "i"
                ? catOpts(st.t)
                : `<optgroup label="支出">${catOpts("e")}</optgroup><optgroup label="收入">${catOpts("i")}</optgroup>`
            }</select>${
              mainCat && mainCat.s && mainCat.s.length
                ? `<select class="inp" id="ssub" aria-label="子分類">${o("", "全部子分類", !st.s)}${mainCat.s.map((x) => o(x, x, st.s === x)).join("")}</select>`

          const g = (s) => api.body.querySelector(s);

              .forEach(
                (b) =>
                  (b.onclick = () => {
                    const t = findTx(b.dataset.tx, b.dataset.d);
                    if (t) openRecord(t);
                  }),
              );
          const draw = () => {
            let e = 0,
              i = 0;
            for (const t of R) {
              if (t.t === "e") e += sub(t);
              if (t.t === "i") i += sub(t);
            }
            const words = st.q.toLowerCase().split(/\s+/).filter(Boolean);
            const shown = R.slice(-shownN).reverse();
            g("#sres").innerHTML =
              `<div class="card" style="margin-bottom:12px"><div class="summary"><div><div class="k">筆數</div><div class="v num">${R.length.toLocaleString()}</div></div><div><div class="k">支出合計</div><div class="v num exp">${money(e)}</div></div><div><div class="k">收入合計</div><div class="v num inc">${money(i)}</div></div></div>${R.length > shown.length ? `<div class="small muted" style="margin-top:8px">先顯示最近 ${shown.length} 筆，縮小條件可以直接看更早的</div>` : ""}</div><div class="stack">${dayGroups(shown, { year: true, row: { mark: words } })}${R.length > shown.length ? `<button class="btn morebtn" id="sMoreBtn">再顯示 300 筆（還有 ${(R.length - shown.length).toLocaleString()} 筆）</button>` : ""}</div>`;
            bindRows();

            if (mb)
              mb.onclick = () => {
                shownN += 300;

          const run = () => {
            st.q = g("#sq").value.trim();
            st.min = g("#smin").value;

            st.from = g("#sfrom").value;
            st.to = g("#sto").value;
            st.acc = g("#sacc").value;
            st.c = g("#scat") ? g("#scat").value : "";
            st.s = g("#ssub") ? g("#ssub").value : "";
            const words = st.q.toLowerCase().split(/\s+/).filter(Boolean);
            const mn = st.min === "" ? -Infinity : +st.min,
              mx = st.max === "" ? Infinity : +st.max;
            if (
              !words.length &&
              st.t === "all" &&
              st.min === "" &&
              st.max === "" &&
              !st.from &&
              !st.to &&
              !st.acc &&

            ) {

      /* ----- settings ----- */

      function openSettings() {

            Boolean,

          // building blocks
          const grp = (id, title, desc, body) =>
            `<details class="card sgrp" data-g="${id}" ${openSet.has(id) ? "open" : ""}><summary><span>${title}<span class="sdesc">${desc}</span></span></summary><div class="sbody">${body}</div></details>`;

          const colrow = (label, ctl, hint) =>
            `<div class="srow col"><span class="sl">${label}${hint ? `<small>${hint}</small>` : ""}</span>${ctl}</div>`;

            `<select class="inp" data-s="${name}" aria-label="${esc(name)}" ${extra}>${opts.map(([v, l]) => `<option value="${esc(v)}" ${String(v) === String(val) ? "selected" : ""}>${esc(l)}</option>`).join("")}</select>`;
          const sw = (name, on) =>
            `<label class="switch"><input type="checkbox" data-t="${name}" ${on ? "checked" : ""}><i></i></label>`;
          const link = (more, label, hint) =>
            `<div class="srow"><button class="link" data-l="${more}"><span class="sl">${label}${hint ? `<small>${hint}</small>` : ""}</span><span class="chev">›</span></button></div>`;
          // round 4: the 摘要 page is gone (主頁 covers it), so only the 帳目 status-row pieces remain
          const SUM = [
            ["today", "今天花了多少"],
            ["streak", "連續記帳天數"],

      /* ========== CSV import ========== */
      function decodeBuf(buf) {
        const b = new Uint8Array(buf);
        let enc = "utf-8",
          off = 0;
        if (b[0] === 0xff && b[1] === 0xfe) {
          enc = "utf-16le";
          off = 2;
        } else if (b[0] === 0xfe && b[1] === 0xff) {
          enc = "utf-16be";
          off = 2;
        } else if (b[0] === 0xef && b[1] === 0xbb && b[2] === 0xbf) {
          enc = "utf-8";
          off = 3;
        } else {
          let z0 = 0,
            z1 = 0;
          const n = Math.min(b.length, 2000);
          for (let i = 0; i < n; i++) if (!b[i]) i % 2 ? z1++ : z0++;
          if (z1 > n / 8) enc = "utf-16le";
          else if (z0 > n / 8) enc = "utf-16be";
          else {
            try {
              new TextDecoder("utf-8", { fatal: true }).decode(b);
              enc = "utf-8";
            } catch (e) {
              enc = "big5";
            }
          }
        }
        return { text: new TextDecoder(enc).decode(b.subarray(off)), enc };
      }
      function parseDelimited(text) {
        const first = text.split(/\r?\n/, 1)[0] || "";
        const delim = (first.match(/\t/g) || []).length >= (first.match(/,/g) || []).length ? "\t" : ",";
        const rows = [];
        let row = [],
          f = "",
          q = false;
        for (let i = 0; i < text.length; i++) {
          const c = text[i];
          if (q) {
            if (c === '"') {
              if (text[i + 1] === '"') {
                f += '"';
                i++;
              } else q = false;
            } else f += c;
          } else if (c === '"' && f === "") q = true;
          else if (c === delim) {
            row.push(f);
            f = "";
          } else if (c === "\n" || c === "\r") {
            if (c === "\r" && text[i + 1] === "\n") i++;
            row.push(f);
            f = "";
            if (row.some((x) => x !== "")) rows.push(row);
            row = [];
          } else f += c;
        }
        row.push(f);
        if (row.some((x) => x !== "")) rows.push(row);
        return { rows, delim };

        raw.reverse();
        const out = [];
        const used = new Set();
        let paired = 0;
        const pend = {}; // transfer legs waiting for a partner, keyed by date+建檔時間
        raw.forEach((x, i) => {
          x.i = i;
        });
        const mkExtra = (t, x, isXfer) => {
          if (x.ct) t.ct = x.ct;
          if (isCW) {
            if (x.gps !== (isXfer ? "" : "0,0")) t.gps = x.gps;
            if (x.addr) t.addr = x.addr;
            if (x.inv) t.inv = x.inv;
            // keep the original text of a number when our formatting would not reproduce it
            if (x.as !== cwNum(Math.abs(x.a))) t.as = x.as;
            if (x.rs !== cwNum(x.r)) t.rs = x.rs;
            if (x.vs !== cwSub(Math.abs(x.v))) t.vs = x.vs;
          }
        };
        for (const x of raw) {
          const xfer = isX(x);
          const t = { id: "", d: x.d, acc: x.acc, ts: x.i + 1 };
          if (xfer) {
            t.t = "a";
            const s = neg(x) ? -1 : 1;
            t.a = s * Math.abs(x.a);
            t.r = x.r;
            t.v = s * Math.abs(x.v);
            t.c = /^\[.*\]$/.test(x.c) ? x.c : /^\[.*\]$/.test((x.n || "").trim()) ? x.n.trim() : "[轉帳]";
            t.n = x.n || "";
            if (x.p && x.p !== CW_NOPROJ) t.p = x.p;
            if (x.r !== 1) t.cur = fxName(x.acc);
            mkExtra(t, x, true);
            t._k = x.d + "|" + x.ct;
            t._s = s;
          } else {
            t.t = /收入/.test(x.type) ? "i" : /支出/.test(x.type) ? "e" : x.a < 0 ? "e" : "i";
            t.a = Math.abs(x.a);
            t.c = x.c;
            if (x.s) t.s = x.s;
            if (x.p && x.p !== CW_NOPROJ) t.p = x.p;
            if (x.n) t.n = x.n;
            if (x.r !== 1) {
              t.r = x.r;
              t.cur = x.cur && x.cur !== "TWD" && x.cur !== "NTD" ? x.cur : fxName(x.acc);
            }
            if (Math.abs(Math.abs(x.v) - r2(Math.abs(x.a) * x.r)) > 1e-9) t.v = Math.abs(x.v);
            mkExtra(t, x, false);
          }
          out.push(t);
        }
        // pass 3: pair the 支出 leg and 收入 leg of each transfer (same day, same 建檔時間, same NT$ value, different accounts)
        const groups = {};
        out.forEach((t, i) => {
          if (t.t === "a" && isCW && t.ct) (groups[t._k] || (groups[t._k] = [])).push(i);
        });
        const drop = new Set();
        for (const k in groups) {
          const L = groups[k];
          for (const i of L) {
            if (drop.has(i) || out[i]._s > 0 || out[i]._x) continue;
            const o = out[i];
            const j = L.find(
              (j) =>
                !drop.has(j) &&
                !out[j]._x &&
                j !== i &&
                out[j]._s > 0 &&
                Math.abs(Math.abs(out[j].v) - Math.abs(o.v)) < 0.005 &&
                out[j].acc !== o.acc &&
                (out[j].n || "") === (o.n || "") &&
                (out[j].p || "") === (o.p || ""),
            );
            if (j === undefined) continue;
            const n = out[j];
            // merged transfer: from o.acc to n.acc; keep both legs' original amounts and row order
            const x = {
              id: "",
              d: o.d,
              t: "x",
              acc: o.acc,
              to: n.acc,
              a: Math.abs(o.a),
              ts: o.ts,
              its: n.ts,
              ct: o.ct,
            };
            if (o.r !== 1) {
              x.r = o.r;
              x.cur = o.cur;
            }
            if (Math.abs(o.v) !== r2(Math.abs(o.a) * (o.r || 1))) x.v = Math.abs(o.v);
            if (Math.abs(n.a) !== Math.abs(o.a) || n.r !== o.r) {
              x.ia = Math.abs(n.a);
              x.ir = n.r;
              if (Math.abs(n.v) !== r2(Math.abs(n.a) * n.r)) x.iv = Math.abs(n.v);
            }
            x.n = o.n || "";
            if (o.p) x.p = o.p;
            for (const f of ["gps", "addr", "inv", "as", "rs", "vs"]) {
              if (o[f] !== undefined) x[f] = o[f];
              if (n[f] !== undefined) x["i" + f] = n[f];
            }
            out[i] = x;
            out[i]._x = 1;
            drop.add(j);
            paired++;
          }
        }
        const out2 = out
          .filter((t, i) => !drop.has(i))
          .map((t) => {
            delete t._k;
            delete t._s;
            delete t._x;
            return t;
          });
        const seq = {};
        for (const t of out2) {
          seq[t.d] = (seq[t.d] || 0) + 1;
          t.id = "i" + t.d.replace(/-/g, "") + "-" + seq[t.d].toString(36);
        }
        return { tx: out2, paired, bad, sign, delim, head, rows: raw.length, positiveXfer: false };
      }
      /* CWMoney-compatible export: same columns, quoting, ordering and number style, UTF-16LE + BOM, LF */
      function cwNum(n) {
        // 金額／匯率: plain, no grouping
        if (!isFinite(n)) return "0";
        const s = String(+(+n).toPrecision(15));
        return s.includes("e") ? (+n).toFixed(6).replace(/\.?0+$/, "") : s;
      }
      function cwSub(n) {
        // 小計: thousands grouping, up to 4 decimals
        return (+n).toLocaleString("en-US", { maximumFractionDigits: 4, minimumFractionDigits: 0 });
      }
      function buildCWExport(list) {
        const q = (s) => '"' + String(s ?? "").replace(/"/g, '""') + '"';
        const line = (a) => a.map(q).join("\t") + "\t";
        const D = (d) => d.replace(/-/g, "/");
        const ctOf = (t) =>
          t.ct ||
          (() => {
            const d = new Date(t.ts || Date.now());
            return `${String(d.getFullYear()).slice(2)}/${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;
          })();
        const P = (t) => t.p || CW_NOPROJ;
        const rowsOut = [];
        const add = (d, ts, l) => rowsOut.push({ d, ts, l });
        for (const t of list) {
          const r = t.r || 1,
            ct = ctOf(t);
          if (t.t === "e" || t.t === "i") {
            const v = t.v != null ? t.v : r2(t.a * r);
            add(
              t.d,
              t.ts,
              line([
                D(t.d),
                t.t === "e" ? "支出" : "收入",
                t.c,
                t.s || "",
                t.acc,
                P(t),
                t.as ?? cwNum(t.a),
                t.rs ?? cwNum(r),
                t.vs ?? cwSub(v),
                ct,
                t.gps ?? "0,0",
                t.addr ?? "",
                t.inv ?? "",
                "",
                t.n ?? "",
              ]),
            );
          } else if (t.t === "x") {
            const ov = t.v != null ? t.v : r2(t.a * r);
            const ia = t.ia ?? t.a,
              ir = t.ir ?? r,
              iv = t.iv != null ? t.iv : t.ia != null ? r2(ia * ir) : ov;
            const outL = line([
              D(t.d),
              "支出",
              "",
              "",
              t.acc,
              P(t),
              t.as ?? cwNum(t.a),
              t.rs ?? cwNum(r),
              t.vs ?? cwSub(ov),
              ct,
              t.gps ?? "",
              t.addr ?? "",
              t.inv ?? "",
              "",
              t.n ?? "[轉帳]",
            ]);
            const inL = line([
              D(t.d),
              "收入",
              "",
              "",
              t.to,
              P(t),
              t.ias ?? cwNum(ia),
              t.irs ?? cwNum(ir),
              t.ivs ?? cwSub(iv),
              ct,
              t.igps ?? "",
              t.iaddr ?? "",
              t.iinv ?? "",
              "",
              t.n ?? "[轉帳]",
            ]);
            add(t.d, t.ts || 0, outL);
            add(t.d, t.its != null ? t.its : (t.ts || 0) + 0.5, inL); // new transfers: 收入 leg listed first, like CWMoney
          } else {
            const v = t.v != null ? Math.abs(t.v) : r2(Math.abs(t.a) * r);
            add(
              t.d,
              t.ts,
              line([
                D(t.d),
                t.a < 0 ? "支出" : "收入",
                "",
                "",
                t.acc,
                P(t),
                t.as ?? cwNum(Math.abs(t.a)),
                t.rs ?? cwNum(r),
                t.vs ?? cwSub(v),
                ct,
                t.gps ?? "",
                t.addr ?? "",
                t.inv ?? "",
                "",
                t.n ?? t.c ?? "[轉帳]",
              ]),
            );
          }
        }
        rowsOut.sort((a, b) => (a.d < b.d ? 1 : a.d > b.d ? -1 : (b.ts || 0) - (a.ts || 0)));
        return [CW_HEAD.join("\t") + "\t", ...rowsOut.map((r) => r.l)].join("\n") + "\n";
      }

      async function doImport(P, mode, prog) {
        if (S.mode === "sample") endSample(true);
        const months = new Map(
          mode === "replace" ? [] : [...S.months].map(([k, v]) => [k, Object.assign({}, v)]),
        );
        let skipped = 0;
        // append: an entry is a duplicate only while the ledger holds as many identical ones as the file —
        // two genuinely identical entries in the file (same day, amount, note…) both come in
        const sig = (t) =>
          [t.d, t.t, t.a, t.acc, t.to || "", t.c, t.s || "", t.n || "", t.ct || ""].join("|");
        const have = new Map();
        if (mode === "append")
          for (const m of months.values())
            for (const id in m) {
              const s = sig(m[id]);
              have.set(s, (have.get(s) || 0) + 1);
            }
        for (const t of P.tx) {
          if (mode === "append") {
            const s = sig(t),
              n = have.get(s) || 0;
            if (n > 0) {
              have.set(s, n - 1);
              skipped++;
              continue;
            }
          }
          const k = mkey(t.d);
          if (!months.has(k)) months.set(k, {});
          const m = months.get(k);
          let id = t.id;
          while (m[id]) id += "x";
          t.id = id;
          m[id] = t;
        }
        // categories & accounts
        const count = { e: {}, i: {} };
        for (const t of P.tx)
          if (t.t === "e" || t.t === "i") {
            const o = count[t.t][t.c] || (count[t.t][t.c] = { n: 0, s: {} });
            o.n++;
            if (t.s) o.s[t.s] = (o.s[t.s] || 0) + 1;
          }
        const build = (ty) =>
          Object.entries(count[ty])
            .sort((a, b) => b[1].n - a[1].n)
            .map(([n, o]) => ({
              n,
              s: Object.entries(o.s)
                .sort((a, b) => b[1] - a[1])
                .map((x) => x[0]),
            }));
        if (mode === "replace") {
          const keepB = S.meta.budgets,
            keepR = S.meta.recurring,
            keepX = S.meta.excl;
          const oldAcc = new Map(S.meta.accounts.map((a) => [a.name, a]));
          const accN = [...new Set(P.tx.map((t) => t.acc))];
          const lastUse = {};
          for (const t of P.tx) lastUse[t.acc] = t.d;
          const stale = addDays(todayStr(), -540);
          S.meta = Object.assign(defaultMeta(), {
            budgets: keepB,
            recurring: keepR,
            excl: keepX,
            sign: P.sign,
            projects: [...new Set(P.tx.filter((t) => t.p).map((t) => t.p))].map((n) => ({ n })),
          });
          S.meta.accounts = accN.map(
            (n) =>
              oldAcc.get(n) || {
                name: n,
                group: guessGroup(n),
                init: 0,
                hidden: lastUse[n] < stale ? true : undefined,
              },
          );
          const ce = build("e"),
            ci = build("i");
          if (ce.length) S.meta.cats.e = ce;
          if (ci.length) S.meta.cats.i = ci;
        } else {
          for (const t of P.tx) {
            ensureAcc(t.acc);
            ensureCat(t.t, t.c, t.s);
            if (t.p && !S.meta.projects.find((p) => p.n === t.p)) S.meta.projects.push({ n: t.p });
          }
        }
        const oldKeys = [...S.months.keys()];
        S.months = months;
        rebuild();
        hideToast(); // an old 復原 must not put a deleted entry back into the new data
        prog(0.5, "寫入手機儲存空間…");
        for (const k of oldKeys) if (!months.has(k)) persist(k); // months that vanished are deleted
        await saveLocal();
        prog(1, skipped ? `完成，跳過 ${skipped.toLocaleString()} 筆重複` : "完成");
        return skipped;
      }

      /* ========== export / backup ========== */
      async function offerFile(filename, data, onDone) {
        const type = filename.endsWith(".json") ? "application/json" : "text/csv";
        const blob = data instanceof Blob ? new Blob([data], { type }) : new Blob([data], { type });
        const file = new File([blob], filename, { type });
        if (navigator.canShare && navigator.canShare({ files: [file] })) {
          try {
            await navigator.share({ files: [file], title: filename });
            onDone && onDone();
            toast("已送出");
            return;
          } catch (e) {
            if (e && e.name === "AbortError") return;
          }
        }
        const url = URL.createObjectURL(blob);
        const a = document.createElement("a");
        a.href = url;
        a.download = filename;
        document.body.appendChild(a);
        a.click();
        a.remove();
        setTimeout(() => URL.revokeObjectURL(url), 30000);
        onDone && onDone();
        toast("已匯出 " + filename);
      }
      function utf16le(str) {
        const buf = new Uint8Array(2 + str.length * 2);
        buf[0] = 0xff;
        buf[1] = 0xfe;
        for (let i = 0; i < str.length; i++) {
          const c = str.charCodeAt(i);
          buf[2 + i * 2] = c & 255;
          buf[3 + i * 2] = c >> 8;
        }
        return buf;
      }
      function doExport() {
        if (!D.count) {
          toast("還沒有帳可以匯出");
          return;
        }
        offerFile(`CSV_${todayStr().replace(/-/g, "_")}_CHT.CSV`, new Blob([utf16le(buildCWExport(D.tx))]));
      }
      function doBackup() {
        if (S.mode === "sample") {
          toast("這是範例，先按上面的「結束範例」再備份");
          return;
        }
        offerFile(
          `帳本備份_${todayStr().replace(/-/g, "")}.json`,
          JSON.stringify(
            Object.assign({ app: "逐筆帳本", v: 1, at: new Date().toISOString() }, snapshotState()),
          ),
          () => {
            S.meta.lastBackup = todayStr();
            saveMeta();
            render();
          },
        );
      }
      function openRestore() {
        openSheet("還原備份", (api) => {
          api.body.innerHTML = `<div class="stack"><div class="card stack"><span>選之前備份存下的檔案（通常在 iCloud 雲碟或「檔案」App）。還原後，現在的資料會被備份的內容取代。</span><div class="btnrow"><label class="btn primary" for="rIn">選擇備份檔</label><input type="file" id="rIn" class="vh" accept=".json,application/json"></div><div id="rBox"></div></div></div>`;
          api.body.querySelector("#rIn").onchange = async (e) => {
            const f = e.target.files[0];
            if (!f) return;
            try {
              const o = JSON.parse(await f.text());
              if (!o || typeof o !== "object" || !o.meta || !o.months || typeof o.months !== "object")
                throw new Error("不是這個帳本的備份檔");
              const isD = (x) => /^\d{4}-\d{2}-\d{2}$/.test(String(x || ""));
              // only well-formed dates may enter the data (they end up in HTML attributes and in sort keys)
              let n = 0,
                dropped = 0;
              const months = {};
              for (const k in o.months) {
                const m = o.months[k];
                if (!/^\d{4}-\d{2}$/.test(k) || !m || typeof m !== "object") {
                  dropped += m && typeof m === "object" ? Object.keys(m).length : 0;
                  continue;
                }
                const out = {};
                for (const id in m) {
                  const t = m[id];
                  if (!t || typeof t !== "object" || !isD(t.d) || mkey(t.d) !== k) {
                    dropped++;
                    continue;
                  }
                  out[id] = t;
                  n++;
                }
                if (Object.keys(out).length) months[k] = out;
              }
              const meta = mergeMeta(o.meta);
              if (!isD(meta.lastBackup)) delete meta.lastBackup;
              if (!isD(meta.backupSnooze)) delete meta.backupSnooze;
              if (!isD(meta.created)) meta.created = todayStr();
              meta.recurring = (Array.isArray(meta.recurring) ? meta.recurring : []).filter(
                (r) => r && r.tpl && isD(r.next) && (!r.end || isD(r.end)),
              );
              api.body.querySelector("#rBox").innerHTML =
                `<div class="confirm"><span>備份含 ${n.toLocaleString()} 筆帳（${esc(String(o.at || "").slice(0, 10))}）。還原會取代目前的 ${D.count.toLocaleString()} 筆。${dropped ? `<br>有 ${dropped.toLocaleString()} 筆日期格式不對，會略過。` : ""}</span><div class="btnrow"><button class="btn danger" id="rGo">還原</button></div></div>`;
              api.body.querySelector("#rGo").onclick = async () => {
                if (S.mode === "sample") endSample(true);
                hideToast();
                const old = [...S.months.keys()];
                S.meta = meta;
                S.months = new Map(Object.entries(months));
                rebuild();
                for (const k of old) if (!S.months.has(k)) persist(k);
                await saveLocal();
                api.close();
                S.tab = "list";
                render();
                toast("已還原");
              };
            } catch (err) {
              toast("無法讀取：" + err.message);
            }
          };
        });
      }
      // kept only because the view's action map still names it; nothing sets S.localOffer any more
      async function migrateLocal() {
        const o = S.localOffer;
        if (!o) return;
        S.localOffer = null;
        S.meta = mergeMeta(o.meta);
        S.months = new Map(Object.entries(o.months));
        await saveLocal();
        commit();
      }

      /* ========== sample data ========== */
      function startSample() {
        // neutral, evenly spread demo data: shows what the reports look like without anyone's real life in it
        hideToast();
        S.sample = { mode: S.mode, meta: S.meta, months: S.months };
        S.mode = "sample";
        S.meta = defaultMeta();
        S.months = new Map();
        S.meta.accounts = [
          { name: "現金", group: "現金", init: 3000 },
          { name: "薪轉戶", group: "銀行", init: 0 },
          { name: "信用卡", group: "信用卡", init: 0 },
          { name: "LINE Pay", group: "電子支付", init: 500 },
        ];
        S.meta.firstRunDone = true;
        S.meta.projects = [{ n: "範例・東京五日" }];
        S.meta.budgets = { total: 30000, cats: { 飲食: 12000, 交通: 4000, 娛樂: 3000 } };
        let seed = 7;
        const rnd = () => (seed = (seed * 16807) % 2147483647) / 2147483647;
        const pick = (a) => a[Math.floor(rnd() * a.length)];
        const amt = (lo, hi, step = 1) => Math.round((lo + rnd() * (hi - lo)) / step) * step;
        const t0 = todayStr();
        let k = addMonths(mkey(t0), -5);
        const add = (t) => {
          const kk = mkey(t.d);
          if (!S.months.has(kk)) S.months.set(kk, {});
          t.id = uid() + Math.floor(rnd() * 1e6);
          t.ts = Date.parse(t.d) + Math.floor(rnd() * 1e5);
          S.months.get(kk)[t.id] = t;
        };
        add({ d: addMonths(mkey(t0), -6) + "-28", t: "a", a: 60000, acc: "薪轉戶", c: "[餘額調整]" });
        while (k <= mkey(t0)) {
          const n = k === mkey(t0) ? +t0.slice(8) : daysIn(k);
          for (let d = 1; d <= n; d++) {
            const ds = k + "-" + pad(d);
            const wd = parseD(ds).getDay();
            // 飲食 ≈ 40%：早餐／午餐／晚餐／飲料
            if (rnd() < 0.85)
              add({
                d: ds,
                t: "e",
                a: amt(45, 90, 5),
                acc: pick(["現金", "LINE Pay"]),
                c: "飲食",
                s: "早餐",
              });
            if (rnd() < 0.8)
              add({
                d: ds,
                t: "e",
                a: amt(90, 160, 5),
                acc: pick(["現金", "LINE Pay", "信用卡"]),
                c: "飲食",
                s: "午餐",
              });
            if (rnd() < 0.7)
              add({
                d: ds,
                t: "e",
                a: amt(120, 260, 10),
                acc: pick(["現金", "信用卡"]),
                c: "飲食",
                s: "晚餐",
              });
            if (rnd() < 0.5) add({ d: ds, t: "e", a: amt(40, 75, 5), acc: "LINE Pay", c: "飲食", s: "飲料" });
            // 交通 ≈ 15%
            if (wd >= 1 && wd <= 5 && rnd() < 0.7)
              add({ d: ds, t: "e", a: amt(30, 60, 5), acc: "LINE Pay", c: "交通", s: "大眾運輸", n: "通勤" });
            if (rnd() < 0.1)
              add({ d: ds, t: "e", a: amt(600, 1000, 50), acc: "信用卡", c: "交通", s: "加油" });
            if (rnd() < 0.05)
              add({ d: ds, t: "e", a: amt(150, 350, 10), acc: "信用卡", c: "交通", s: "計程車" });
            // 購物 ≈ 15%
            if (rnd() < 0.1)
              add({
                d: ds,
                t: "e",
                a: amt(200, 1500, 50),
                acc: "信用卡",
                c: "購物",
                s: pick(["服飾", "生活用品", "3C"]),
              });
            // 娛樂 ≈ 10%
            if ((wd === 0 || wd === 6) && rnd() < 0.35)
              add({
                d: ds,
                t: "e",
                a: amt(300, 900, 50),
                acc: "信用卡",
                c: "娛樂",
                s: pick(["電影", "運動", "遊戲"]),
              });
            // 其他 ≈ 5%
            if (rnd() < 0.03) add({ d: ds, t: "e", a: amt(100, 600, 50), acc: "現金", c: "其他", s: "雜項" });
          }
          // 居家 ≈ 15%：房租、電話費、水電
          add({ d: k + "-05", t: "i", a: 45000, acc: "薪轉戶", c: "薪資", s: "月薪", n: "薪水" });
          if (k + "-25" <= t0) add({ d: k + "-25", t: "e", a: 5500, acc: "薪轉戶", c: "居家", s: "房租" });
          if (k + "-10" <= t0) add({ d: k + "-10", t: "e", a: 499, acc: "信用卡", c: "居家", s: "電話費" });
          if (k + "-18" <= t0)
            add({ d: k + "-18", t: "e", a: amt(600, 1100, 50), acc: "薪轉戶", c: "居家", s: "水電瓦斯" });
          if (k + "-12" <= t0)
            add({ d: k + "-12", t: "x", a: amt(9000, 14000, 500), acc: "薪轉戶", to: "信用卡", n: "繳卡費" });
          if (k + "-20" <= t0) add({ d: k + "-20", t: "x", a: 3000, acc: "薪轉戶", to: "現金", n: "領現金" });
          if (k + "-20" <= t0)
            add({ d: k + "-20", t: "x", a: 2000, acc: "薪轉戶", to: "LINE Pay", n: "儲值" });
          if (k + "-15" <= t0)
            add({ d: k + "-15", t: "e", a: 390, acc: "信用卡", c: "娛樂", s: "訂閱", n: "影音平台" });
          k = addMonths(k, 1);
        }
        const pk = addMonths(mkey(t0), -2);
        add({
          d: pk + "-14",
          t: "e",
          a: 8800,
          acc: "信用卡",
          c: "娛樂",
          s: "旅遊",
          p: "範例・東京五日",
          n: "機票",
        });
        add({
          d: pk + "-15",
          t: "e",
          a: 12600,
          acc: "信用卡",
          c: "娛樂",
          s: "旅遊",
          p: "範例・東京五日",
          n: "住宿四晚",
        });
        add({
          d: pk + "-16",
          t: "e",
          a: 1800,
          acc: "現金",
          c: "飲食",
          s: "晚餐",
          p: "範例・東京五日",
          cur: "JPY",
          r: 0.215,
          n: "居酒屋",
        });
        add({
          d: pk + "-17",
          t: "e",
          a: 3200,
          acc: "現金",
          c: "購物",
          s: "生活用品",
          p: "範例・東京五日",
          cur: "JPY",
          r: 0.215,
          n: "藥妝",
        });
        S.meta.recurring = [
          {
            id: "r1",
            tpl: { t: "e", a: 5500, acc: "薪轉戶", c: "居家", s: "房租" },
            f: "m",
            day: 25,
            next: (mkey(t0) + "-25" <= t0 ? addMonths(mkey(t0), 1) : mkey(t0)) + "-25",
          },
          {
            id: "r2",
            tpl: { t: "e", a: 499, acc: "信用卡", c: "居家", s: "電話費" },
            f: "m",
            day: 10,
            next: (mkey(t0) + "-10" <= t0 ? addMonths(mkey(t0), 1) : mkey(t0)) + "-10",
          },
        ];
        S.month = mkey(t0);
        S.tab = "list";
        commit();
        toast("已載入範例，這些是假資料，改動不會存下來");
      }
      function endSample(silent) {
        if (!S.sample) return;
        Object.assign(S, { mode: S.sample.mode, meta: S.sample.meta, months: S.sample.months, sample: null });
        if (pend.size) flushNow(); // writes that were queued when the sample started
        commit();
        if (silent !== true) toast("已結束範例");
      }

      boot();
    </script>
  </body>
</html>
